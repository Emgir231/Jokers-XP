<script>
/* Filet de sécurité : en cas d'erreur, message visible et style de secours pour la session (données intactes) */
let safeMode = false;
window.__SAFE = location.hash === '#safe';
function showErr(msg) {
  let b = document.getElementById('errbox');
  if (!b) {
    b = document.createElement('div'); b.id = 'errbox';
    b.setAttribute('role', 'alert');
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:200;background:#FFFFFF;color:#111111;border:2px solid #C8334F;border-radius:14px;padding:10px 12px;font:13px/1.4 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25)';
    (document.body || document.documentElement).appendChild(b);
  }
  b.textContent = msg;
}
function fallbackStyle(e) {
  const reason = e && (e.message || (e.reason && e.reason.message) || e.reason);
  const msg = String(reason || 'erreur inconnue');
  if (safeMode) { showErr('Erreur : ' + msg); return; }
  safeMode = true;
  try {
    showErr('Erreur : ' + msg + '. Style de secours Éducatif utilisé pour cette session. Tes classes et tes élèves ne sont pas modifiés.');
    if (typeof theme !== 'undefined') theme = 'ubuntu';
    if (typeof applyTheme === 'function') applyTheme();
    if (typeof render === 'function') render();
  } catch (x) { showErr('Erreur persistante : ' + (x && x.message ? x.message : x)); }
}
window.addEventListener('DOMContentLoaded', () => { if (window.__SAFE) showErr('Mode de secours (#safe) : style Éducatif pour cette ouverture. Tes données ne sont pas modifiées. Ouvre le lien sans #safe pour revenir à ton style.'); });
window.addEventListener('error', fallbackStyle);
window.addEventListener('unhandledrejection', fallbackStyle);
</script>

.news{max-width:520px;width:calc(100vw - 32px);max-height:80vh;overflow-y:auto;text-align:left}.news h3{margin:0 0 12px;font-size:20px;color:var(--ink)}.news ul{margin:0 0 16px;padding-left:24px;color:var(--ink);font-size:15px;line-height:1.45}.news li{margin:8px 0}.news .nchk{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink);margin:8px 0 16px}.news .nchk input{width:20px;height:20px}


/* Titre de classe en sombre : la teinte de la classe est éclaircie pour rester lisible sur fond sombre */
body[data-mode=dark] .bar .bt b{color:color-mix(in srgb,var(--lv,#888) 55%,#ffffff)!important}

/* Bouton « Classes » en sombre : même teinte éclaircie que le titre de classe */
body[data-mode=dark] .bar .back{color:color-mix(in srgb,var(--lv,#888) 55%,#ffffff)!important}
/* Couleurs de statut : fixes, identiques dans tous les designs (décision) */
:root{--st-gain:#1F7A4C;--st-gain-strong:#1F9D55;--st-loss:#D6363E;--st-abs:#4B5382;--st-warn:#A8501F;--st-over:#B8443E;--plus:#1F9D55;--plus-d:#17784A;--minus:#D6363E;--minus-d:#A8232B}
/* Bannière : une seule règle, couleurs lues depuis le registre (notice) */
button.banner.banner,.banner.banner{border-radius:22px;background:var(--notice);color:var(--notice-ink);box-shadow:inset 0 0 0 2px var(--notice-edge)}
/* ===== QUATRE TYPES DE BOUTONS (référence) =====
   principal : action principale, fond = accentuation, texte automatique   -> .btn.primary, .tool.primary, .chip.on
   secondaire : action courante, fond de surface                         -> .btn, .chip
   danger     : action destructive (couleur de retrait fixe)               -> .btn.danger, .btn.danger-o
   discret    : navigation ou icône, sans fond                             -> .back, .icon
   Les statuts + et − (.rb.plus, .rb.minus) sont des boutons de statut, à part.
   Ces règles décrivent la famille ; aucune valeur n'a été changée ici. */
/* ===== Plan : la barre est une colonne explicite, la zone Non placés ne peut plus la recouvrir ===== */
.planbar{display:flex;flex-direction:column;gap:8px}
.pzone.pbac{margin-top:16px}
/* Plan dans l'écran séparé : la barre colle en haut de la zone de défilement (sans décalage de l'ancien en-tête) */
#fullpanel .planbar{top:0}
/* Deux niveaux d'ombre (validés) : repos pour les cartes et lignes, élevé pour les fenêtres. Le filet est une bordure, pas une ombre. */
:root{--ombre-repos:0 1px 3px rgba(0,0,0,.15);--ombre-eleve:0 8px 24px rgba(0,0,0,.2);--filet:inset 0 0 0 2px rgba(0,0,0,.1)}
.sheet{box-shadow:var(--ombre-eleve)}
/* Titres de section : une seule taille et un seul poids pour tous les sous-titres (réglages, fiche, catégories) */
.sbh,.ccat,.sheet h3{font-size:18px;font-weight:700}
/* Texte personnalisé : barre de mise en forme et rendu */
.rt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.rt-sel{font:inherit;padding:6px 8px;border-radius:12px;border:1px solid var(--line)}
.rt-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.rt-hi{border-radius:8px}
.rt-tog{min-width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.rt{outline:none;min-height:120px;white-space:pre-wrap;color:var(--ink)}
.rt-f-serif{font-family:Georgia,'Times New Roman',serif}
.rt-f-sans{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.rt-f-manu{font-family:'Jokers Manuscrite','Comic Sans MS',cursive}
.rt-f-dys{font-family:'Jokers OpenDyslexic',system-ui,sans-serif}
.rt-c-bleu{color:#1F4E9A}.rt-c-noir{color:#111111}.rt-c-rouge{color:#B3261E}.rt-c-vert{color:#1E6B3A}.rt-c-violet{color:#6A3FA0}.rt-c-orange{color:#9A4A00}
.rt-h-jaune{background:#FFF0A8}.rt-h-rouge{background:#FFD2CC}.rt-h-vert{background:#CDEFD6}.rt-h-bleu{background:#CFE3FA}.rt-h-violet{background:#E4D6FA}.rt-h-orange{background:#FFE0BF}
.rt-u{text-decoration:underline;text-decoration-color:currentColor}
.rt-s{text-decoration:line-through;text-decoration-color:currentColor}

/* Vue widget : texte simple, taille standard, tronqué avec … quand il est trop long */
.rt-plain{font-size:16px;line-height:1.35;white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden;text-align:left;color:var(--ink)}
.rt-size{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.rt-num{width:76px;padding:6px 8px;border-radius:12px;border:1px solid var(--line);font:inherit;background:var(--surface);color:var(--ink)}
/* Une fenêtre ouverte depuis le plan plein écran passe devant lui (ordre d'empilement) */
/* Fenêtres ouvertes depuis le plan plein écran : leur conteneur passe devant (les voiles et boîtes de dialogue restent dans l'ordre entre eux) */
body:has(#fullpanel.on) #layer, body:has(#fullpanel.on) #dialog{position:relative;z-index:160}
/* Texte personnalisé en plein écran : la zone de saisie occupe tout l'espace disponible */
.pwidget.full .wbody{display:flex;flex-direction:column;flex:1;min-height:0}
.pwidget.full .rt-bar{flex:none}
.pwidget.full .rt[contenteditable="true"]{flex:1 1 auto;min-height:200px;overflow:auto}
.pwidget.full .wbody:has(.rt){padding:1.5vh 2vw;align-items:stretch;justify-content:flex-start;text-align:left}
/* Présentation paysage : zone des noms réductible (6 widgets quand elle est réduite) */
.pbody.land.collapsed{grid-template-columns:44px repeat(3,minmax(0,1fr))}
.pbody.land.nonames{grid-template-columns:repeat(3,minmax(0,1fr))}
.pzstrip{align-items:flex-start;justify-content:flex-start;padding:8px 0}
.pzstrip .pnamesbtn{writing-mode:vertical-rl;transform:rotate(180deg);padding:12px 6px}
.pzl .pnamesbtn{align-self:flex-end}
.pzx{display:flex;flex-direction:column;gap:12px;min-height:0}
.pzx>.pwidget{flex:1 1 0;min-height:0;overflow:hidden}
.pzm .wcol, .pzr .wcol, .pzx .wcol{min-width:0}
</style>

<div id="app"></div>
<div id="layer"></div>
<div id="dialog"></div>
<div id="popover"></div>
<div id="toast"></div>

<script>
/* ============ Données de base ============ */
const KEY = 'jokers_xp_v1';
const LEVELS = ['5e', '4e', '3e', 'Autre'];
/* Teintes par niveau, saturation moyenne : 5e vert, 4e bleu, 3e rouge, Autre marron. Chaque entrée : [bordure, texte foncé, fond] */
const MID = {
  '5e': ['#5E9E78', '#6FA25F', '#4E9A8E', '#7F9F7A', '#3F7F5A', '#9AA352'],
  '4e': ['#5C8DBF', '#4F6FC0', '#7E9AB5', '#4A9AAB', '#7A78C4', '#54709A'],
  '3e': ['#C46A6A', '#D08060', '#B9677F', '#A06070', '#B97460', '#C77A8E'],
  'Autre': ['#9A7B63', '#B58A52', '#836252', '#B0A070', '#A8664A', '#8E8078']
};
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16), k = x => Math.max(0, Math.min(255, Math.round(x * f))); return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(x => k(x).toString(16).padStart(2, '0')).join(''); };
const TONES = Object.fromEntries(Object.entries(MID).map(([lv, arr]) => [lv, arr.map(h => [shade(h, .82), shade(h, .5), h])]));
const toneOf = (level, i) => { const t = TONES[level] || TONES['Autre']; return t[(i || 0) % t.length]; };
const genderBadge = s => s.genre === 'F' ? `<span class="gbadge gF" title="Fille" aria-label="Fille">${ico('venus')}</span>` : s.genre === 'M' ? `<span class="gbadge gM" title="Garçon" aria-label="Garçon">${ico('mars')}</span>` : '';
/* Fond de carte : si le texte blanc n'atteint pas 4,5 sur la teinte, on assombrit légèrement le fond (le plus proche de l'original qui passe) */
const cardBgFor = hex => { if (contrastOf(hex, '#FFFFFF') >= 4.5) return hex; for (let f = 0.98; f > 0.4; f -= 0.01) { const c = shade(hex, f); if (contrastOf(c, '#FFFFFF') >= 4.5) return c; } return shade(hex, 0.4); };
const toneStyle = c => { const t = toneOf(c.level, c.tone); return `--lv:${t[0]};--lvd:${t[1]};--lvbg:${cardBgFor(t[2])}`; };
/* Prochaine teinte libre pour un niveau (en ignorant éventuellement une classe) */
function nextTone(level, exceptId) {
  const used = state.classes.filter(c => c.level === level && c.id !== exceptId).map(c => c.tone);
  for (let i = 0; i < 6; i++) if (!used.includes(i)) return i;
  return used.length % 6;
}
const PRICE = {green:8, blue:22, violet:50};
const COLOR_LABEL = {green:'Cartes vertes', blue:'Cartes bleues', violet:'Cartes violettes', special:'Cartes spéciales'};

const DEFAULT_CONDITIONS = [
  {id:'c1', name:'Je participe', xp:2, limit:0},
  {id:'c2', name:"J'aide autrui", xp:2, limit:0},
  {id:'c3', name:"J'écris le cours au propre avec les couleurs", xp:3, limit:0},
  {id:'c4', name:'Je suis calme et appliqué', xp:4, limit:0},
  {id:'c5', name:'Je fais des efforts', xp:4, limit:1},
  {id:'c6', name:"Je réussis l'éval", xp:5, limit:1},
  {id:'c7', name:'Mon classeur est à jour', xp:5, limit:2},
  {id:'c8', name:"Je m'améliore sur plusieurs semaines", xp:6, limit:1}
];


/* ===================== CONDITIONS : CATÉGORIES, ICÔNES, COULEURS ===================== */
const COND_CATS = {

/* ===================== DÉPENDANCES ENTRE CARTES ===================== */
/* state.cardReq[carteId] = {ids:[prérequis], mode:'or'|'and'} ; état de la carte pour un élève */
const cardReq = id => (state.cardReq || {})[id] || {ids: [], mode: 'or'};
const cardChildren = id => CARDS.filter(o => cardReq(o.id).ids.includes(id)).map(o => o.id);
function cardAncestors(id, out = new Set()) { cardReq(id).ids.forEach(p => { if (!out.has(p)) { out.add(p); cardAncestors(p, out); } }); return out; }
const cardLoops = (child, pre) => child === pre || cardAncestors(pre).has(child);
const cardHasThisChapter = (s, c, key) => (s.cards || []).some(x => x.key === key && x.chapter === c.chapter);
const cardHas = (s, key) => (s.cards || []).some(x => x.key === key);
/* 'retired' : une carte qui en dépend est obtenue ; 'got' ; 'lock' : prérequis manquant ou frère déjà obtenu ce chapitre ; 'free' */
function cardState(s, c, id) {
  if (cardChildren(id).some(ch => cardHas(s, ch))) return 'retired';
  if (cardHas(s, id)) return 'got';
  const r = cardReq(id);
  if (!r.ids.length) return 'free';
  const sat = r.mode === 'and' ? r.ids.every(p => cardHasThisChapter(s, c, p)) : r.ids.some(p => cardHasThisChapter(s, c, p));
  if (!sat) return 'lock';
  const frere = CARDS.some(o => o.id !== id && cardHasThisChapter(s, c, o.id) && cardReq(o.id).ids.some(p => r.ids.includes(p)));
  return frere ? 'lock' : 'free';
}
/* Chaîne d'origine, validée : Relecture > Support > Encyclopédie, etc. */
function chainSeed() {
  const ROWS = [['Relecture','Support','Encyclopédie'], ['Réponse','Chance','Pari'], ['Appel','Binôme','Alliance'], ['Mots','Musique','Libre'], ['Vision','Diversion','Espions']];
  const idOf = n => (CARDS.find(k => k.n === n) || {}).id, req = {};
  ROWS.forEach(([a, b, c]) => { const A = idOf(a), B = idOf(b), C = idOf(c); if (A && B) req[B] = {ids: [A], mode: 'or'}; if (B && C) req[C] = {ids: [B], mode: 'or'}; });
  return req;
}

/* Tarif d'une carte : prix de base moins le prix de la plus haute carte de niveau inférieur déjà achetée sur la même ligne */
function costFor(s, k, ch) {
  const base = k.price != null ? k.price : PRICE[k.c];
  let disc = 0, from = null;
  const lowers = [];
  s.cards.forEach(x => {
    const o = CARD_BY_ID[x.key];
    if (o && (x.chapter === undefined || x.chapter === ch) && o.c in RANK && o.r === k.r && RANK[o.c] < RANK[k.c]) {
      lowers.push(x);
      const po = o.price != null ? o.price : PRICE[o.c];
      if (po > disc) { disc = po; from = o; }
    }
  });
  return {price:base - disc, base, from, lowers};
}

/* Rangs : les 5 premiers niveaux d'XP ; les ex æquo d'un même niveau sont tous affichés */
function rankGroups(list, key, n) {
  const levels = [...new Set(list.map(s => s[key]).filter(v => v > 0))].sort((a, b) => b - a).slice(0, n);
  return levels.map((xp, i) => ({rank: i + 1, xp, names: list.filter(s => s[key] === xp)}));
}
/* Hauteurs proportionnelles : top 1 = maximum, top 5 = minimum */
function metalHeights(groups, lo, hi, key) {
  const top = groups[0][key], low = groups[groups.length - 1][key];
  return groups.map(g => top === low ? hi : lo + (hi - lo) * (g[key] - low) / (top - low));
}
function podiumHTML(c) {
  const g = rankGroups(c.students, 'total', 5);
  if (!g.length) return '';
  const hs = metalHeights(g, 44, 124, 'xp'), order = [3, 1, 0, 2, 4].filter(i => g[i]);
  const cols = order.map(i => {
    const r = g[i];
    const names = r.names.map(s => `<div class="pn">${esc(s.prenom || s.nom)} ${esc(s.nom.charAt(0))}.</div>`).join('');
    const sd = (Math.random() * 20 + 2).toFixed(1), sp = (Math.random() * 15 + 25).toFixed(1);
    return `<div class="pl p${i + 1}"><div class="pnames">${names}</div><div class="pt">${nf(r.xp)} XP</div>
      <div class="blk mt${r.rank}" style="height:${hs[i].toFixed(0)}px;--sd:${sd}s;--sp:${sp}s"><span class="medal m${Math.min(r.rank, 3)}">${r.rank}</span></div></div>`;
  }).join('');
  return `<div class="podium podium5">${cols}</div><div class="pcap">Total d'XP gagnés depuis le début</div>`;
}

function gainBlock(s, cd) {
  if (isBlocked(s)) return `Gain bloqué jusqu'à ${blockTime(s)}`;
  if (cd.limit > 0 && (s.uses[cd.id] || 0) >= cd.limit) return `Limite atteinte pour ${s.prenom || s.nom}`;
  return '';
}
function condGain(cid, sid, condId) {

  if (!s || !cd) return;
  const why = gainBlock(s, cd);
  if (why) { buzz([50, 50, 50]); toast(why); return; }
  const used = s.uses[cd.id] || 0;
  const u = snapUndo([s]);
  s.xp += cd.xp; s.total += cd.xp; s.uses[cd.id] = used + 1;
  logH(s, cd.name, cd.xp, 'gain'); buzz(30); save(); queueFlash([s.id], 'gain'); render();
  showUndo(`+${cd.xp} XP pour ${s.prenom || s.nom}`, u);

/* Appui simple : fiche. Appui long (1 s) : roue des conditions. */
let wheelT = null, wheelSup = false, wheelSt = null, wheelSupT = null;
const WHEEL_MS = 1000;

}
function wheelDown(e, cid, sid) {

function wheelClear() {

/* ----- Roue rapide : 8 emplacements autour du doigt (4 en haut, 4 en bas) ----- */
const WHEEL_TOP = [-157.5, -112.5, -67.5, -22.5], WHEEL_BOT = [22.5, 67.5, 112.5, 157.5];
const WHEEL_SEL_MIN = 40;
function wheelDefault() {
  const un = state.conditions.filter(c => !(c.limit > 0)).slice(0, 4).map(c => 'cond:' + c.id);
  const list = [...un, 'pres', 'oubli'];
  while (list.length < 8) list.push('vide');
  return list.slice(0, 8);
}
function wheelSlots() {
  const raw = state.wheel && Array.isArray(state.wheel.slots) ? state.wheel.slots : wheelDefault();
  const ids = new Set(state.conditions.map(c => c.id));
  return Array.from({length: 8}, (_, i) => {
    const v = raw[i] || 'vide';
    if (v.startsWith('cond:') || v.startsWith('retrait:')) return ids.has(v.split(':')[1]) ? v : 'vide';
    return ['pres', 'oubli', 'annuler', 'vide'].includes(v) ? v : 'vide';
  });
}
const WHEEL_TILE_R = 150; /* cartes 100 x 58 px : écart minimal ~15 px entre voisines */
function wheelOpen() {
  const st = wheelSt; if (!st) return;
  st.open = true; wheelSup = true; buzz(20);
  document.body.classList.add('wheel-open');
  try { window.getSelection().removeAllRanges(); } catch (e) {}
  const s = getStudent(getClass(st.cid), st.sid), slots = wheelSlots();
  const cx = Math.min(Math.max(st.x0, 190), innerWidth - 190), cy = Math.min(Math.max(st.y0, 172), innerHeight - 172);
  st.cx = cx; st.cy = cy;
  st.items = slots.map((v, i) => {
    const deg = i < 4 ? WHEEL_TOP[i] : WHEEL_BOT[i - 4];
    const a = deg * Math.PI / 180;
    return {i, v, a, deg, x: cx + WHEEL_TILE_R * Math.cos(a), y: cy + WHEEL_TILE_R * Math.sin(a), ...wheelInfo(v, s)};
  });
  const el = document.createElement('div');
  el.id = 'wheel'; el.className = 'wheel';
  el.innerHTML = st.items.map(it => {
    const cls = it.act ? (it.why ? 'wi off' : 'wi') : 'wi empty';
    return `<div class="${cls}" data-i="${it.i}" style="left:${it.x.toFixed(1)}px;top:${it.y.toFixed(1)}px">` + (it.act ? `<b>${esc(it.label)}</b><small>${esc(it.sub)}</small>` : '') + `</div>`;
  }).join('');
  document.body.appendChild(el);
}
function wheelMove(e) {
  const st = wheelSt; if (!st) return;
  if (!st.open) { if (Math.hypot(e.clientX - st.x0, e.clientY - st.y0) > 12) wheelCancel(); return; }
  const el = $('wheel'); if (!el) return;
  const dx = e.clientX - st.cx, dy = e.clientY - st.cy, d = Math.hypot(dx, dy);
  let pick = null;
  if (d > WHEEL_SEL_MIN) {
    const a = Math.atan2(dy, dx); let best = Infinity;
    st.items.forEach(it => { if (!it.act) return; const df = Math.abs(Math.atan2(Math.sin(a - it.a), Math.cos(a - it.a))); if (df < best) { best = df; pick = it; } });
  }
  const prev = st.sel ? st.sel.i : null;
  st.sel = pick ? {i: pick.i, v: pick.v, act: pick.act, why: pick.why, label: pick.label, sub: pick.sub} : null;
  if (pick && prev !== pick.i) buzz(8);
  el.querySelectorAll('.wi').forEach(n => n.classList.toggle('on', !!st.sel && +n.dataset.i === st.sel.i));
}
function wheelUp() {
  const st = wheelSt; if (!st) return;
  const wasOpen = st.open, sel = st.sel;
  wheelClear();
  if (!wasOpen) return;
  clearTimeout(wheelSupT); wheelSupT = setTimeout(() => { wheelSup = false; }, 400);
  if (!sel) return;
  if (sel.why) { toast(sel.why); return; }
  wheelAct(sel.v, st.cid, st.sid);
}
function wheelAct(v, cid, sid) {
  const s = getStudent(getClass(cid), sid); if (!s) return;
  if (v.startsWith('cond:')) { condGain(cid, sid, v.slice(5)); return; }
  if (v.startsWith('retrait:')) {
    const cd = state.conditions.find(c => c.id === v.slice(8)); if (!cd) return;
    const real = Math.min(cd.xp, s.xp), u = snapUndo([s]);
    s.xp -= real; s.total = Math.max(0, s.total - cd.xp);
    logH(s, `Retrait : ${cd.name}`, -real, 'loss');
    buzz([50, 50, 50]); save(); queueFlash([s.id], 'loss'); render();
    showUndo(`-${real} XP pour ${s.prenom || s.nom}`, u);
    return;
  }
  if (v === 'pres') { toggleAbsent(cid, sid); render(); return; }
  if (v === 'oubli') {
    const bm = blockMinutes();
    s.blockedUntil = Date.now() + bm * 60000; s.blockDur = bm * 60000;
    logH(s, `Oubli d'affaires : gain d'XP bloqué ${fmtDur(bm)}`, 0, 'block');
    save(); render(); toast(`${s.prenom || s.nom} : gain bloqué jusqu'à ${blockTime(s)}`);
    return;
  }
  if (v === 'annuler') { if (pendingUndo) undoLast(); else toast('Rien à annuler'); }
}
/* Réglage de la roue (Réglages, Outils) */

    + slots.map((v, i) => `<label style="display:block;margin-bottom:8px"><small class="muted">${pos(i)}</small><select class="search" aria-label="${pos(i)}" onchange="setWheelSlot(${i}, this.value)">${opts.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`).join('')

function setWheelSlot(i, v) { const sl = wheelSlots(); sl[i] = v; state.wheel = {slots: sl}; save(); openSettingsPage('roue'); }

/* Événements de la séance du jour (gains, retraits, achats) */
/* Demi-journées : matin jusqu'à 13 h, après-midi ensuite (les créneaux 8 h-12 h 50 et 13 h 10-18 h tombent dedans) */
function sessionKey(t) {
  const d = new Date(t), m = d.getHours() * 60 + d.getMinutes();
  return d.toDateString() + (m < 13 * 60 ? ' matin' : ' après-midi');
}
/* Séance en cours = demi-journée de la dernière attribution d'XP de la classe */
function currentSession(c) {
  let latest = null;
  c.students.forEach(s => s.history.forEach(h => { if (h.kind === 'gain' && h.delta > 0 && (!latest || h.t > latest)) latest = h.t; }));
  return sessionKey(latest || new Date().toISOString());
}
/* Participation : nombre d'attributions d'XP dans la séance donnée */
function participation(s, key) {
  return s.history.filter(h => h.kind === 'gain' && h.delta > 0 && sessionKey(h.t) === key).length;
}
/* Jauge vers le prochain palier (8, 22, 50 XP) */
const PALIERS = [8, 22, 50];
function pgBar(s) {
  const next = PALIERS.find(p => s.xp < p);
  const prev = Math.max(0, ...PALIERS.filter(p => p <= s.xp));
  const pct = next ? Math.min(100, Math.max(0, Math.round(((s.xp - prev) / (next - prev)) * 100))) : 100;
  const label = next ? `Prochain palier : ${next} XP` : 'Palier maximal atteint';
  return `<div class="pgbar" title="${label}" aria-label="${label}"><i style="width:${pct}%"></i></div>`;
}

    `<button role="menuitem" class="${view.sort === k ? 'on' : ''}" onclick="setSort('${k}')"><span>${l}</span>${view.sort === k ? `<span class="tk">${ico('tick')}</span>` : ''}</button>`).join('')}</div>`;

function rowHTML(c, s, anchor) {
  const ab = isAbsent(s), bl = isBlocked(s);

    + (ranked.length > MAXDOTS ? `<span class="dot more">+${ranked.length - MAXDOTS}</span>` : '');
  return `<div class="row ${ab ? 'abs' : ''} ${bl ? 'blk' : ''}" data-sid="${s.id}" ${anchor || ''} onclick="rowTap(\'${c.id}\',\'${s.id}\')" onpointerdown="wheelDown(event,\'${c.id}\',\'${s.id}\')" oncontextmenu="event.preventDefault()" >${ilotBadge(c, s)}
    <div class="who"><div class="nm"><b>${esc(s.nom)}</b> ${esc(s.prenom)}${genderBadge(s)}</div>

      <button class="rb minus" aria-label="Retirer des XP" onclick="event.stopPropagation();openRemove('${c.id}','${s.id}')">−</button></div></div>`;

/* Plan de classe : 6 îlots en 2 colonnes et 3 lignes (A bas droite, B bas gauche, C au-dessus de A, D au-dessus de B, E au-dessus de C, F au-dessus de D) */
const PLAN_ORDER = ['F', 'E', 'D', 'C', 'B', 'A'];
function planBoardHTML(c) {
  const chip = s => `<button class="pchip" data-sid="${s.id}" onpointerdown="planDown(event,'${c.id}','${s.id}')">${esc(s.nom)} ${esc(s.prenom)}</button>`;
  const zone = l => { const list = c.students.filter(s => (s.ilot || '') === l); return `<div class="pzone" data-zone="${l}" style="${ilotStyle(l)}"><div class="pzh"><b>${l}</b><small>${list.length}</small></div><div class="pzb">${list.map(chip).join('')}</div></div>`; };
  const none = c.students.filter(s => !s.ilot || !ILOTS.includes(s.ilot));
  const bac = `<div class="pzone pbac" data-zone=""><div class="pzh"><b>Non placés</b><small>${none.length}</small></div><div class="pzb">${none.map(chip).join('')}</div></div>`;
  return `${bac}<div class="pgrid">${PLAN_ORDER.map(zone).join('')}</div>`;
}
let pdrag = null;
function planDown(e, cid, sid) {
  if (e.button > 0) return;
  pdrag = {cid, sid, x0: e.clientX, y0: e.clientY, moved: false, ghost: null};
  window.addEventListener('pointermove', planMove);
  window.addEventListener('pointerup', planUp);
  window.addEventListener('pointercancel', planEnd);
}
function zoneAt(x, y) { const el = document.elementFromPoint(x, y); return el ? el.closest('[data-zone]') : null; }
function planMove(e) {
  if (!pdrag) return;
  if (!pdrag.moved) {
    if (Math.hypot(e.clientX - pdrag.x0, e.clientY - pdrag.y0) < 8) return;
    pdrag.moved = true;
    const src = document.querySelector(`.pchip[data-sid="${pdrag.sid}"]`);
    const g = document.createElement('div'); g.className = 'pghost'; g.textContent = src ? src.textContent : '';
    document.body.appendChild(g); pdrag.ghost = g;
  }
  e.preventDefault();
  pdrag.ghost.style.left = e.clientX + 'px'; pdrag.ghost.style.top = e.clientY + 'px';
  const z = zoneAt(e.clientX, e.clientY);
  document.querySelectorAll('.pzone.over').forEach(n => { if (n !== z) n.classList.remove('over'); });
  if (z) z.classList.add('over');
}
function planUp(e) {
  const d = pdrag;
  planEnd();
  if (!d) return;
  if (!d.moved) { assignIlot(d.cid, d.sid); return; }
  const z = zoneAt(e.clientX, e.clientY);
  if (!z) return;
  const s = getStudent(getClass(d.cid), d.sid);
  s.ilot = z.dataset.zone || null; s.ilotT = Date.now();
  save(); refreshPlan();
}
function planEnd() {
  pdrag = null;
  window.removeEventListener('pointermove', planMove);
  window.removeEventListener('pointerup', planUp);
  window.removeEventListener('pointercancel', planEnd);
  document.querySelectorAll('.pghost').forEach(n => n.remove());
  document.querySelectorAll('.pzone.over').forEach(n => n.classList.remove('over'));
}
function renderList() {
  const c = getClass(view.id), wrap = view.mode === 'plan' ? $('planlist') : $('listwrap');
  if (!c || !wrap) return;
  if (view.cplan) { wrap.innerHTML = customPlanHTML(c); return; }
  if (view.plan) { wrap.innerHTML = planBarHTML(c) + planBoardHTML(c); return; }
  let list = c.students.slice();
  const q = norm(view.q || '');
  if (q) list = list.filter(s => norm(nameOf(s)).includes(q));
  const tf = view.tags || [];
  if (tf.length) list = list.filter(matchTags);
  const banner = tf.length ? `<div class="prev" style="margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Filtre : ${tf.map(id => tagIcon(tagDef(id) || {})).join('')} (${list.length} élève${pl(list.length, '', 's')})</span><button class="chip" onclick="clearTagFilter()">✕ Effacer</button></div>` : '';
  const alpha = (a, b) => a.nom.localeCompare(b.nom, 'fr') || a.prenom.localeCompare(b.prenom, 'fr');
  if (view.sort === 'xp') list.sort((a, b) => b.xp - a.xp || alpha(a, b));
  else if (view.sort === 'xpa') list.sort((a, b) => a.xp - b.xp || alpha(a, b));
  else if (view.sort === 'cards') list.sort((a, b) => unusedCards(b).length - unusedCards(a).length || alpha(a, b));
  else if (view.sort === 'discret') { const key = currentSession(c); list.sort((a, b) => participation(a, key) - participation(b, key) || alpha(a, b)); }
  else if (view.sort === 'ilot') list.sort((a, b) => ilotRank(a) - ilotRank(b) || alpha(a, b));
  else list.sort(alpha);
  if (!list.length) {
    wrap.innerHTML = c.students.length
      ? `${banner}<div class="empty">Aucun élève ne correspond à ${tf.length ? 'ce filtre' : 'cette recherche'}.</div>`
      : `<div class="empty"><div class="big">${ico('users')}</div>Cette classe est vide.<br>Importe une liste ou ajoute un élève.</div>`;
    return;
  }
  const showIdx = false;
  const seen = {}, letters = [];
  const rows = list.map(s => {
    let a = '';
    if (showIdx) { const L = letterOf(s); if (!seen[L]) { seen[L] = 1; letters.push(L); a = `data-l="${L}"`; } }
    return rowHTML(c, s, a);
  }).join('');
  const idx = showIdx ? `<div class="index" ontouchstart="idxGo(event)" ontouchmove="idxGo(event)">${letters.map(L => `<span data-i="${L}" onclick="jumpTo('${L}')">${L}</span>`).join('')}</div>` : '';
  wrap.innerHTML = `${banner}<div class="listbox ${showIdx ? 'idx' : ''}">${rows}${idx}</div>`;
}

function jumpTo(L) {
  const el = document.querySelector(`.row[data-l="${L}"]`);
  if (el) el.scrollIntoView({block:'start'});
}
function idxGo(e) {
  const t = e.touches ? e.touches[0] : e;
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if (el && el.dataset && el.dataset.i) jumpTo(el.dataset.i);
}

/* ============ Feuilles, dialogue, toast ============ */
let sheetSeq = 0;
const MODE_TITLES = ['Appel rapide', 'Importer une liste', 'XP pour toute la classe', 'Tirage au sort', 'Historique'];
/* Un mode s'affiche dans la classe, à la place de la liste élèves */
/* Outils de la classe : chacun s'ouvre dans un écran séparé, plein écran, fermé par une croix en haut à droite */
function enterMode(name, fn, ...args) {
  if (view.mode === name) { exitMode(); return; }
  view.mode = name; view.modeHtml = ''; view.plan = false; view.cplan = false; view.label = null;
  if (view.name !== 'class') { view.name = 'class'; view.id = args[0]; }

function fullPanel() {
  let f = $('fullpanel');
  if (!f) { f = document.createElement('div'); f.id = 'fullpanel'; f.className = 'fullpanel'; f.innerHTML = '<div class="fp-head"><span class="fp-title"></span><button class="icon fp-close" aria-label="Fermer" onclick="exitMode()">' + ICONS_CLOSE + '</button></div><div class="fp-body"></div>'; document.body.appendChild(f); }

}
const ICONS_CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function openFullPanel(title, html) {

}

function modeFrame(html) { return html.replace(/<button class="icon" aria-label="Fermer"[\s\S]*?<\/button>/, '').replace(/<button class="back"[\s\S]*?<\/button>/, ''); }
function openSheet(html) {

  const modeT = MODE_TITLES.find(t => html.includes('>' + t + '<'));
  if (view.name === 'class' && view.mode && modeT) { openFullPanel(modeT, modeFrame(html)); return; }
  sheetSeq++;
  setTimeout(updateScreenTitle, 0);

  $('layer').innerHTML = `<div class="backdrop" onclick="closeSheet()"></div><div class="sheet" role="dialog">${hasExit ? '' : `<div class="sclose"><button aria-label="Fermer" onclick="closeSheet()">${ico('x')}</button></div>`}${html}</div>`;

function closeSheet() {

  const L = $('layer');
  document.body.classList.remove('lock');

  /* style Vero : la feuille se referme en douceur (~450 ms) */

  if (sh) sh.classList.add('out'); if (bk) bk.classList.add('out');

function confirmDialog(title, text, ok = 'Confirmer', danger = false) {
  return new Promise(res => {
    $('dialog').innerHTML = `<div class="backdrop dim"></div><div class="dlg" role="alertdialog"><h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="dbtns"><button class="btn" id="dn">Annuler</button><button class="btn ${danger ? 'danger' : 'primary'}" id="dy">${esc(ok)}</button></div></div>`;
    $('dn').onclick = () => { $('dialog').innerHTML = ''; res(false); };
    $('dy').onclick = () => { $('dialog').innerHTML = ''; res(true); };
  });

let tt;
function toast(m) {
  const t = $('toast'); pendingUndo = null; clearTimeout(undoTimer); t.classList.remove('undo'); t.textContent = m; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200);
}
function done(msg, u) { save(); closeSheet(); render(); if (u) showUndo(msg, u); else if (msg) toast(msg); }
function newEvId() { try { if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {} return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 11); }
function logH(s, label, delta, kind) { s.history.push({id: newEvId(), t:new Date().toISOString(), label, delta, kind}); }
/* ----- Retours tactiles et annulation ----- */
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
let pendingUndo = null, undoTimer = null;
function snapUndo(students) {
  return {seq: null, snaps: students.map(s => ({s, xp: s.xp, total: s.total, uses: JSON.parse(JSON.stringify(s.uses || {})), cards: JSON.parse(JSON.stringify(s.cards || [])), blockedUntil: s.blockedUntil, hlen: s.history.length}))};
}
function hideUndo() {
  clearTimeout(undoTimer); undoTimer = null; pendingUndo = null;
  const t = $('toast'); t.classList.remove('on', 'undo'); t.innerHTML = '';
}
function showUndo(msg, u) {
  const t = $('toast');
  pendingUndo = u; u.seq = changeSeq;
  clearTimeout(tt);
  t.innerHTML = '';
  const span = document.createElement('span'); span.textContent = msg;
  const b = document.createElement('button'); b.className = 'ub'; b.textContent = 'Annuler'; b.onclick = undoLast;
  const bar = document.createElement('span'); bar.className = 'ubar'; bar.innerHTML = '<i></i>';
  t.append(span, b, bar); t.classList.add('on', 'undo');
  clearTimeout(undoTimer); undoTimer = setTimeout(hideUndo, 6000);
}
function undoLast() {
  const u = pendingUndo; if (!u) return;
  if (typeof u.restore === 'function') { u.restore(); hideUndo(); render(); toast('Action annulée'); return; }
  if (changeSeq !== u.seq) { hideUndo(); toast("Annulation impossible : une autre modification a eu lieu"); return; }
  u.snaps.forEach(p => { const s = p.s; s.xp = p.xp; s.total = p.total; s.uses = p.uses; s.cards = p.cards; s.blockedUntil = p.blockedUntil; s.history.length = p.hlen; });
  hideUndo(); save(); render(); toast('Action annulée');
}


/* ===================== EMPLOI DU TEMPS (semaines Q1 / Q2) ===================== */
const TT_AFTER = 10 * 60 * 1000;
const TT_DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];
const ttInit = () => { state.tt = state.tt || {start: null, cells: {}}; state.tt.cells = state.tt.cells || {}; return state.tt; };
const ttExcluded = (day, slotId) => day === 3 && slotId[0] === 'S';
const ttCellKey = (day, slotId) => day + '|' + slotId;
const ttCell = (day, slotId) => ttInit().cells[ttCellKey(day, slotId)] || {split: false, q1: null, q2: null};
function ttCellObj(day, slotId) { const k = ttCellKey(day, slotId); ttInit(); return state.tt.cells[k] || (state.tt.cells[k] = {split: false, q1: null, q2: null}); }
function ttMonday(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
/* Semaine Q1 ou Q2 : une semaine sur deux à partir de la date de départ saisie */
function ttWeekOf(d) {
  const st = ttInit().start; if (!st) return null;
  const [y, m, dd] = st.split('-').map(Number);
  const diff = Math.round((ttMonday(d) - ttMonday(new Date(y, m - 1, dd))) / (7 * 864e5));
  return ((diff % 2) + 2) % 2 === 0 ? 'Q1' : 'Q2';
}
function ttClassAt(day, slotId, week) { const c = ttCell(day, slotId); if (!c.split) return c.q1; return week === 'Q2' ? c.q2 : c.q1; }
function ttSet(day, slotId, week, cid) {
  const c = ttCellObj(day, slotId);
  if (c.split && week === 'Q2') c.q2 = cid; else c.q1 = cid;
  save(); closeSheet(); openSettingsPage('edt');
}
function ttSplit(day, slotId) { const c = ttCellObj(day, slotId); c.split = true; c.q2 = null; save(); openSettingsPage('edt'); }
function ttMerge(day, slotId) {
  const k = ttCellKey(day, slotId), prev = JSON.parse(JSON.stringify(ttCell(day, slotId)));
  const c = ttCellObj(day, slotId); c.split = false; c.q2 = null; save();
  showUndo('Créneau refusionné', {restore: () => { ttInit().cells[k] = prev; save(); }});
  openSettingsPage('edt');
}

/* Occurrences à venir (15 jours), triées par date */
function ttOccurrences(from) {
  const out = [];
  for (let i = 0; i < 15; i++) {
    const d = new Date(from); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + i);
    const dow = ((d.getDay() + 6) % 7) + 1; if (dow > 5) continue;
    const wk = ttWeekOf(d); if (!wk) continue;
    schedule().forEach(sl => {
      if (ttExcluded(dow, sl.id)) return;
      const cid = ttClassAt(dow, sl.id, wk);
      if (!cid || !state.classes.some(c => c.id === cid)) return;
      const [sh, sm] = sl.start.split(':').map(Number), [eh, em] = sl.end.split(':').map(Number);
      const s = new Date(d); s.setHours(sh, sm, 0, 0);
      const e = new Date(d); e.setHours(eh, em, 0, 0);
      out.push({cid, day: dow, slot: sl.id, week: wk, start: s, end: e});
    });
  }
  return out.sort((a, b) => a.start - b.start);
}
/* Flux : une classe par ligne, avec son prochain cours. Un cours disparaît 10 min après sa fin. */
function ttFlow(now = new Date()) {
  const seen = new Set(), flow = [];
  ttOccurrences(now).forEach(o => {
    if (o.end.getTime() + TT_AFTER <= now.getTime() || seen.has(o.cid)) return;
    seen.add(o.cid);
    flow.push(Object.assign({status: o.start <= now && now < o.end ? 'now' : 'next'}, o));
  });
  return {flow, none: state.classes.filter(c => !seen.has(c.id)).sort(byName)};
}
const ttHour = d => d.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
const ttDayLabel = d => d.toDateString() === new Date().toDateString() ? "Aujourd'hui" : d.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'});

  if (!ttInit().start) return '';

  const o = ttOccurrences(now).find(x => x.cid === c.id && x.end.getTime() + TT_AFTER > now.getTime());
  if (!o) return '';
  return `<div class="cnext">${o.start <= now && now < o.end ? 'En cours' : 'Prochain cours : ' + ttDayLabel(o.start) + ' ' + ttHour(o.start)}</div>`;
}

/* Couleurs neutres lues depuis le registre (fond, surfaces, texte, bordures, police).
   L'accentuation (--primary, --acc-*) reste choisie par l'utilisateur et n'est pas touchée. */
function applyDesignTokens() {
  const d = designOf(theme); if (!d) return;
  const m = (resolvedMode() === 'dark' && d.tokens.dark) ? 'dark' : 'light';
  const t = d.tokens[m] || d.tokens.light;
  const b = document.body.style;
  b.setProperty('--surface', t.surface); b.setProperty('--surface-2', t.surface2);
  b.setProperty('--ink', t.ink); b.setProperty('--soft', t.soft);
  b.setProperty('--bg', t.bg); b.setProperty('--line', t.line);
  b.setProperty('--card-ink', t.cardInk || '#ffffff');
  /* Menus : valeurs du registre seulement en mode sombre ; en clair, les valeurs du thème restent actives */
  if (m === 'dark' && t.menuBg) { b.setProperty('--menu-bg', t.menuBg); b.setProperty('--menu-ink', t.menuInk); b.setProperty('--menu-soft', t.menuSoft); }
  else { b.removeProperty('--menu-bg'); b.removeProperty('--menu-ink'); b.removeProperty('--menu-soft'); }
  b.setProperty('--notice', t.notice); b.setProperty('--notice-edge', t.noticeEdge); b.setProperty('--notice-ink', t.noticeInk);
}

const DESIGNS = [

    dark:  {surface: '#303030', surface2: '#3a3a3a', ink: '#f6f5f4', soft: '#a3a3a3', primary: '#E95420', accInk: '#111111', line: '#3d3d3d', bg: '#1e1e1e', font: 'Ubuntu', cardInk: '#ffffff', notice: '#474233', noticeEdge: '#84733f', noticeInk: '#f6f5f4', menuBg: '#1E2230', menuInk: '#EEF2FA', menuSoft: '#A9B3C7'}
  }},

  }}
];
const designOf = id => DESIGNS.find(d => d.id === id) || null;
/* Contraste WCAG entre deux couleurs hexadécimales */
function hexLum(h) {
  const v = [h.slice(1, 3), h.slice(3, 5), h.slice(5, 7)].map(x => parseInt(x, 16) / 255);
  const c = v.map(x => x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function contrastRatio(a, b) { const la = hexLum(a), lb = hexLum(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }
/* Contrôle permanent : texte blanc des cartes sur chaque teinte de classe, fond réellement affiché (≥ 4,5) */
function classToneIssues() {
  const issues = [];
  ['5e', '4e', '3e', 'Autre'].forEach(lv => {
    for (let i = 0; i < 6; i++) {
      const t = toneOf(lv, i), bg = cardBgFor(t[2]);
      const r = contrastOf(bg, '#FFFFFF');
      if (r < 4.5) issues.push(`${lv}#${i} ${bg} = ${r.toFixed(2)}`);
    }
  });
  return issues;
}
/* Contrôle : texte courant et texte secondaire lisibles sur chaque fond de surface (≥ 4,5) */
function designContrastIssues() {
  const issues = [];
  ['#1E88E5', '#E95420', '#F4A6A6', '#111111', '#FFFFFF', '#2E7D32', '#FFEA00'].forEach(base => {
    for (let lum = -40; lum <= 40; lum += 10) {
      const fill = shadeHex(base, lum), ink = inkOn(fill), r = contrastOf(fill, ink);
      if (r < 4.5) issues.push(`accent ${base}@${lum} : ${r.toFixed(2)}`);
    }
  });
  DESIGNS.forEach(d => Object.entries(d.tokens).forEach(([mode, t]) => {
    [['ink', 'surface'], ['ink', 'surface2'], ['soft', 'surface'], ['soft', 'surface2'], ['ink', 'bg']].forEach(([fg, bg]) => {
      const r = contrastRatio(t[fg], t[bg]);
      if (r < 4.5) issues.push(`${d.id} ${mode} : ${fg} sur ${bg} = ${r.toFixed(2)}`);
    });
  }));
  return issues;
}

function doNewChapter(id) {
  const c = getClass(id);
  const name = ($('ch-name').value.trim() || `Chapitre ${c.chapter}`).slice(0, 60);
  const doCards = $('ch-cards').checked, doUses = $('ch-uses').checked;
  const from = chapterStart(c), now = new Date().toISOString();
  const snap = snapUndo(c.students);
  const eleves = c.students.map(s => {
    const inCh = h => h.t >= from;
    const gains = s.history.filter(h => h.kind === 'gain' && inCh(h) && h.delta > 0).reduce((a, h) => a + h.delta, 0);
    const retraits = s.history.filter(h => h.kind === 'loss' && inCh(h)).reduce((a, h) => a + Math.abs(h.delta), 0);
    const achats = s.history.filter(h => h.kind === 'buy' && inCh(h)).length;
    const utilisees = doCards ? s.cards.filter(x => !x.used).length : 0;
    return {id: s.id, nom: s.nom, prenom: s.prenom, gains, retraits, achats, utilisees};
  });
  const total = eleves.reduce((a, e) => a + e.gains, 0);
  const prevLen = c.chapitres_archives.length, prevStart = c.chapterStart;
  c.chapitres_archives.push({id: uid(), t: now, nom: name, debut: from, chapitre: c.chapter, xp: total, eleves});
  c.students.forEach(s => {
    if (doUses) s.uses = {};
    if (doCards) s.cards.forEach(x => {
      if (x.used) return;
      x.used = true;
      logH(s, 'Carte utilisée (fin de chapitre) : ' + ((CARD_BY_ID[x.key] || {}).n || x.key), 0, 'use');
    });
  });
  c.chapter++;
  c.chapterStart = now;
  lastChapter = {cid: id, snap, prevLen, prevStart, chapter: c.chapter - 1, seq: null};
  done(`${c.name} : chapitre ${c.chapter}`);
  lastChapter.seq = changeSeq;
}
function canUndoChapter(cid) { return !!lastChapter && lastChapter.cid === cid && lastChapter.seq === changeSeq; }
function undoChapter(cid) {
  if (!canUndoChapter(cid)) { toast('Annulation impossible : une autre modification a eu lieu'); return; }
  const c = getClass(cid), L = lastChapter;
  L.snap.snaps.forEach(p => { const s = p.s; s.xp = p.xp; s.total = p.total; s.uses = p.uses; s.cards = p.cards; s.blockedUntil = p.blockedUntil; s.history.length = p.hlen; });
  c.chapitres_archives.length = L.prevLen;
  c.chapter = L.chapter;
  if (L.prevStart) c.chapterStart = L.prevStart; else delete c.chapterStart;
  lastChapter = null;
  save(); closeSheet(); render(); toast('Passage de chapitre annulé');
}

/* ============ Corbeille temporaire ============ */
const trashDays = () => state.trashDays === 7 ? 7 : 30;
function trashPush(entry) { state.trash = state.trash || []; state.trash.push(Object.assign({t: Date.now()}, entry)); save(); }
function trashPurge() {
  const limit = Date.now() - trashDays() * 86400000;
  const before = (state.trash || []).length;
  state.trash = (state.trash || []).filter(e => e.t > limit);
  if (state.trash.length !== before) save();
}
function trashRestore(i) {
  const e = (state.trash || [])[i]; if (!e) return;
  if (e.kind === 'class') {
    if (state.classes.some(c => c.id === e.item.id)) { toast('Une classe porte déjà cet identifiant'); return; }
    state.classes.push(e.item);
  } else {
    const c = getClass(e.cid);
    if (!c) { toast('La classe de cet élève n\'existe plus'); return; }
    c.students.push(e.item);
  }
  state.trash.splice(i, 1); done(e.kind === 'class' ? 'Classe restaurée' : 'Élève restauré');
}
function trashDeleteNow(i) { state.trash.splice(i, 1); save(); openSettingsPage('corbeille'); }
function trashEmpty() { state.trash = []; save(); openSettingsPage('corbeille'); }
function trashSetDays(n) { state.trashDays = n; save(); trashPurge(); openSettingsPage('corbeille'); }
function trashLabel(e) { return e.kind === 'class' ? '« ' + e.item.name + ' » (classe)' : nameOf(e.item) + ' (élève)'; }
function trashHTML() {
  trashPurge();
  const list = state.trash || [], d = trashDays();
  const head = `<p class="muted" style="font-size:14px;margin-bottom:10px">Les éléments supprimés restent ici pendant ${d} jours, puis disparaissent définitivement. Ils se restaurent en un appui.</p>
    <div class="chips-row"><button class="chip ${d === 7 ? 'on' : ''}" onclick="trashSetDays(7)">7 jours</button><button class="chip ${d === 30 ? 'on' : ''}" onclick="trashSetDays(30)">30 jours</button></div>`;
  if (!list.length) return head + '<p class="muted" style="margin-top:14px">La corbeille est vide.</p>';
  const rows = list.map((e, i) => {
    const left = Math.max(0, Math.ceil((e.t + d * 86400000 - Date.now()) / 86400000));
    return `<div class="cond" style="margin-top:8px"><b>${esc(trashLabel(e))}</b><p class="muted" style="font-size:13px;margin:4px 0 8px">Encore ${left} jour${left > 1 ? 's' : ''}</p><div class="chips-row"><button class="chip on" onclick="trashRestore(${i})">Restaurer</button><button class="chip" onclick="trashDeleteNow(${i})">Supprimer maintenant</button></div></div>`;
  }).join('');
  return head + rows + `<button class="btn wide" style="margin-top:12px" onclick="trashEmpty()">Vider la corbeille</button>`;
}

function lastFabHTML(c) {

/* ============ Appel rapide en une passe ============ */
let qc = {cid: null, day: null, abs: new Set()};
function openQuickCall(cid) {
  const c = getClass(cid), day = ymd();
  qc = {cid, day, abs: new Set(c.students.filter(isAbsent).map(x => x.id))};
  qcRender();
}
function qcAbsentOn(s, day) { return (s.history || []).some(h => h.kind === 'absent' && h.day === day); }
function qcRender() {
  const c = getClass(qc.cid); if (!c) return;
  const n = qc.abs.size;
  const tiles = c.students.slice().sort((a, b) => (a.nom || '').localeCompare(b.nom || '', 'fr')).map(s => {
    const a = qc.abs.has(s.id);
    return `<button class="qtile ${a ? 'abs' : ''}" aria-pressed="${a}" onclick="qcToggle('${s.id}')"><b>${esc(s.prenom || s.nom)}</b><span>${esc(s.nom)}</span><small>${a ? 'Absent' : 'Présent'}</small></button>`;
  }).join('');
  openSheet(`<h2>Appel rapide</h2>
    <p class="muted" style="font-size:14px">Un appui sur un élève le bascule présent ou absent. Valide ensuite l'appel d'un coup.</p>
    <label>Date de l'appel</label><input type="date" value="${qc.day}" max="${ymd()}" onchange="qcDate(this.value)">
    <p class="muted" id="qc-count" style="font-size:14px">${n} absent${n > 1 ? 's' : ''} sur ${c.students.length}</p>
    <div class="qgrid">${tiles}</div>
    <button class="btn primary wide" style="margin-top:12px" onclick="qcValidate()">Valider l'appel</button>`);
}
function qcToggle(sid) { if (qc.abs.has(sid)) qc.abs.delete(sid); else qc.abs.add(sid); qcRender(); }
function qcDate(v) { qc.day = v || ymd(); qcRender(); }
function qcValidate() {
  const c = getClass(qc.cid); if (!c) return;
  const day = qc.day, today = ymd();
  c.students.forEach(s => {
    const was = qcAbsentOn(s, day), now = qc.abs.has(s.id);
    if (now && !was) s.history.push({t: new Date().toISOString(), label: 'Absent(e)', delta: 0, kind: 'absent', day});
    if (!now && was) { for (let i = s.history.length - 1; i >= 0; i--) if (s.history[i].kind === 'absent' && s.history[i].day === day) { s.history.splice(i, 1); break; } }
    if (day === today) s.absentDate = now ? today : null;
  });
  save(); closeSheet(); render(); toast('Appel enregistré');
}

function duplicateClass(cid) {

  const name = (($('dup-n') || {}).value || '').trim() || (src.name + ' (copie)');

  dup.students = src.students.map(st => { const id = uid(); map[st.id] = id; return Object.assign({}, clone(st), {id}); });
  dup.students.forEach(st => {
    st.sep = (st.sep || []).map(x => map[x]).filter(Boolean);
    st.together = (st.together || []).map(x => map[x]).filter(Boolean);
    if (!keep) { st.xp = 0; st.total = 0; st.uses = {}; st.cards = []; st.history = []; st.absentDate = null; st.blockedUntil = null; }
  });
  if (dup.layout && dup.layout.items) dup.layout.items = dup.layout.items.map(it => Object.assign({}, it, {id: uid(), seats: (it.seats || []).map(x => map[x]).filter(Boolean)}));

async function delClass(id) {

/* ----- Import par copier-coller ----- */
function parseList(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    let nom, prenom;
    if (l.includes(',')) { const i = l.indexOf(','); nom = l.slice(0, i).trim(); prenom = l.slice(i + 1).trim(); }
    else { const p = l.split(/\s+/); nom = p[0]; prenom = p.slice(1).join(' '); }
    return {nom:nom.toUpperCase(), prenom:titleCase(prenom)};
  }).filter(x => x.nom);
}
let impCid = null;
function openImport(cid) {
  impCid = cid;
  openSheet(`<h2>Importer une liste</h2>
    <p class="muted">Un élève par ligne : le premier mot est le nom, le second le prénom. Pour un nom de plusieurs mots, ajoute une virgule : DE LA FONTAINE, Jean</p>
    <label>Colle ta liste ici</label>
    <textarea id="imp-t" placeholder="MARTIN Léa&#10;DURAND Hugo&#10;DE LA FONTAINE, Jean-Pierre" oninput="previewImport()"></textarea>
    <div id="imp-p"></div>
    <button class="btn primary wide" id="imp-b" disabled onclick="doImport()">Importer</button>`);
}
function previewImport() {
  const c = getClass(impCid), list = parseList($('imp-t').value);
  const exists = new Set(c.students.map(s => norm(nameOf(s))));
  const fresh = list.filter(x => !exists.has(norm(`${x.nom} ${x.prenom}`.trim())));
  const dup = list.length - fresh.length;
  $('imp-p').innerHTML = list.length
    ? `<div class="prev"><div>${fresh.length} élève${fresh.length > 1 ? 's' : ''} à ajouter${dup ? `, ${dup} déjà présent${dup > 1 ? 's' : ''} (ignoré${dup > 1 ? 's' : ''})` : ''}</div>
       ${fresh.slice(0, 6).map(x => `<div><b>${esc(x.nom)}</b> ${esc(x.prenom)}</div>`).join('')}${fresh.length > 6 ? `<div class="muted">… et ${fresh.length - 6} autres</div>` : ''}</div>` : '';
  const b = $('imp-b'); b.disabled = !fresh.length;
  b.textContent = fresh.length ? `Importer ${fresh.length} élève${fresh.length > 1 ? 's' : ''}` : 'Importer';
}
function doImport() {
  const c = getClass(impCid), list = parseList($('imp-t').value);
  const exists = new Set(c.students.map(s => norm(nameOf(s))));
  let n = 0;
  list.forEach(x => {
    const k = norm(`${x.nom} ${x.prenom}`.trim());
    if (exists.has(k)) return;
    exists.add(k); c.students.push(newStudent(x.nom, x.prenom)); n++;
  });
  done(`${n} élève${n > 1 ? 's' : ''} importé${n > 1 ? 's' : ''}`);
}

/* Tous les mouvements du jour le plus récent (le plus récent d'abord), affichés au-dessus de l'historique */

function toggleUsed(cid, sid, cardId) {
  const c = getClass(cid), s = getStudent(c, sid), x = s.cards.find(y => y.id === cardId), k = CARD_BY_ID[x.key];
  x.used = !x.used;
  logH(s, (x.used ? 'Carte utilisée : ' : 'Carte remise : ') + (k ? k.n : x.key), 0, 'use');
  save(); render(); openStudent(cid, sid);
}
async function refundCard(cid, sid, cardId) {
  const c = getClass(cid), s = getStudent(c, sid), x = s.cards.find(y => y.id === cardId), k = CARD_BY_ID[x.key];
  const ok = await confirmDialog('Rembourser la carte ?', `${x.price} XP sont rendus à ${s.prenom || s.nom}${x.replaced && x.replaced.length ? ' et la carte remplacée lui est rendue' : ''}. Son total d'XP gagnés ne change pas.`, 'Rembourser');
  if (!ok) return;
  s.xp += x.price; s.cards = s.cards.filter(y => y.id !== cardId);
  if (x.replaced && x.replaced.length) s.cards.push(...x.replaced);
  logH(s, 'Carte remboursée : ' + (k ? k.n : x.key), x.price, 'refund');
  save(); render(); openStudent(cid, sid);
}

let gainCtx = null;
function openGain(cid, sid, from) { gainCtx = {cid, sid, from}; openSheet(gainHTML(cid, sid, from)); markSmall(); }
function markSmall() { const sh = document.querySelector('#layer .sheet'); if (sh) sh.classList.add('small'); }
function gainHTML(cid, sid, from) {
  const c = getClass(cid), s = getStudent(c, sid);
  if (isBlocked(s)) {
    return `${backBtn(cid, sid, from)}<h2>Gain d'XP bloqué</h2><p class="muted"><b>${esc(s.nom)}</b> ${esc(s.prenom)}</p>
      <div class="prev">${blockBadge(s)} Oubli d'affaires : pas de gain d'XP jusqu'à ${blockTime(s)}.</div>
      <button class="btn wide" onclick="liftBlock('${cid}','${sid}')">Lever le blocage</button>`;
  }
  const conds = state.conditions.slice();
  const tile = cd => {
    const m = condMeta(cd), used = s.uses[cd.id] || 0, hit = cd.limit > 0 && used >= cd.limit;
    const info = cd.limit > 0 ? `<small class="${hit ? 'hit' : ''}">${used}/${cd.limit} ce chapitre${hit ? ', limite atteinte' : ''}</small>` : '';
    const val = m.neg ? `−${Math.abs(cd.xp)}` : `+${cd.xp}`;
    return `<button class="ctile ${hit ? 'limit' : ''} ${m.neg ? 'neg' : ''}" style="--tc:${m.color}" onclick="applyGain('${cid}','${sid}','${cd.id}')"><span class="cic">${ico(m.icon)}</span><span class="cp">${val}</span><span class="ctl">${esc(cd.name)}</span>${info}</button>`;
  };
  const groups = condCatOrder().map(k => {
    const list = conds.filter(cd => condMeta(cd).cat === k);
    if (!list.length) return '';
    return `<h3 class="ccat" style="--cc:${COND_CATS[k].color}"><span class="ccdot"></span>${COND_CATS[k].name}</h3><div class="cgrid">${list.map(tile).join('')}</div>`;
  }).join('');
  return `${backBtn(cid, sid, from)}<h2>Ajouter des XP</h2><p class="muted"><b>${esc(s.nom)}</b> ${esc(s.prenom)}, ${s.xp} XP</p>
    ${groups || '<p class="muted">Aucune condition. Ajoutes-en dans les réglages.</p>'}
    <h3>Autre montant</h3>
    <div class="two"><input type="number" inputmode="numeric" id="g-n" min="1" placeholder="XP"><input type="text" id="g-m" placeholder="Motif (facultatif)"></div>
    <button class="btn primary wide" onclick="freeGain('${cid}','${sid}')">Ajouter</button>`;
}
/* Après un gain : la fenêtre reste ouverte et se met à jour sur place */
function gainDone(msg, u, cid, sid) {
  save(); render();
  const sh = document.querySelector('#layer .sheet');
  if (sh && gainCtx && gainCtx.cid === cid && gainCtx.sid === sid) { sh.innerHTML = gainHTML(cid, sid, gainCtx.from); sh.classList.add('small'); }
  if (u) showUndo(msg, u); else if (msg) toast(msg);
}
async function applyGain(cid, sid, condId) {
  lastTouch(cid, sid);
  const c = getClass(cid), s = getStudent(c, sid), cd = state.conditions.find(x => x.id === condId);
  if (isBlocked(s)) { buzz([50, 50, 50]); toast(`Gain bloqué jusqu'à ${blockTime(s)}`); return; }
  const used = s.uses[cd.id] || 0;
  if (cd.limit > 0 && used >= cd.limit) {
    const ok = await confirmDialog('Limite atteinte', `${s.prenom || s.nom} a déjà obtenu « ${cd.name} » ${used} fois ce chapitre (maximum ${cd.limit}). Ajouter quand même ?`, 'Ajouter quand même');
    if (!ok) return;
  }
  const u = snapUndo([s]);
  s.uses[cd.id] = used + 1;
  if (cd.xp < 0) {
    const v = Math.abs(cd.xp), real = Math.min(v, s.xp);
    s.xp -= real; s.total = Math.max(0, s.total - v);
    logH(s, cd.name, -real, 'loss'); buzz([40, 40]);
    queueFlash([s.id], 'loss');
    gainDone(`−${real} XP pour ${s.prenom || s.nom}`, u, cid, sid);
    return;
  }
  s.xp += cd.xp; s.total += cd.xp;
  logH(s, cd.name, cd.xp, 'gain'); buzz(30);
  queueFlash([s.id], 'gain');
  gainDone(`+${cd.xp} XP pour ${s.prenom || s.nom}`, u, cid, sid);
}
function freeGain(cid, sid) {
  const n = parseInt($('g-n').value, 10);
  if (!n || n < 1) { toast('Entre un nombre d\'XP'); return; }
  const c = getClass(cid), s = getStudent(c, sid), m = $('g-m').value.trim();
  if (isBlocked(s)) { buzz([50, 50, 50]); toast(`Gain bloqué jusqu'à ${blockTime(s)}`); return; }
  const u = snapUndo([s]);
  s.xp += n; s.total += n; logH(s, m || 'Ajout manuel', n, 'gain'); buzz(30);
  queueFlash([s.id], 'gain');
  gainDone(`+${n} XP pour ${s.prenom || s.nom}`, u, cid, sid);
}

/* ============ Historique de la classe ============ */
let histo = {cid:'', cat:'all', sort:'date', q:'', limit:80};
const HCATS = [['all', 'Tout'], ['gain', 'Gagnés'], ['loss', 'Perdus'], ['oubli', 'Oublis'], ['abs', 'Absences'], ['cartes', 'Cartes'], ['archives', 'Archives des chapitres']];
const HLABEL = {gain:'Gain', loss:'Retrait', oubli:'Oubli', abs:'Absence', cartes:'Carte'};
function histCat(h) {
  if (h.kind === 'absent') return 'abs';
  if (h.kind === 'block') return 'oubli';
  if (h.kind === 'buy' || h.kind === 'use' || h.kind === 'refund') return 'cartes';
  if (h.kind === 'gain') return 'gain';
  if (h.kind === 'loss') return 'loss';
  return h.delta > 0 ? 'gain' : h.delta < 0 ? 'loss' : 'cartes';
}
function openHisto(cid) {
  histo = {cid, cat:'all', sort:'date', q:'', limit:80};
  const c = getClass(cid);
  openSheet(`<div class="shead"><div><h2>Historique</h2><small>${esc(c.name)}</small></div>
      <button class="icon" aria-label="Fermer" onclick="closeSheet()">${ico('x')}</button></div>
    <div class="sorts" id="histo-sort" style="margin-top:10px"></div>
    <div class="sorts" id="histo-chips"></div>
    <input class="search" type="search" placeholder="Filtrer par élève" style="margin:4px 0 8px" oninput="histo.q=this.value;histo.limit=80;renderHisto()">
    <div id="histo-body"></div>`);
  renderHisto();
}
function histoSet(k, v) { histo[k] = v; histo.limit = 80; renderHisto(); }
function renderHisto() {
  const c = getClass(histo.cid);
  if (!c || !$('histo-body')) return;
  const q = norm(histo.q);
  const all = [];
  c.students.forEach(s => s.history.forEach(h => { if (!q || norm(nameOf(s)).includes(q)) all.push({s, h, cat:histCat(h)}); }));
  const count = {all:all.length, gain:0, loss:0, oubli:0, abs:0, cartes:0, archives:(c.chapitres_archives || []).length};
  all.forEach(r => count[r.cat]++);
  $('histo-sort').innerHTML = [['date', 'Par date'], ['student', 'Par élève']]
    .map(([k, l]) => `<button class="chip ${histo.sort === k ? 'on' : ''}" onclick="histoSet('sort','${k}')">${l}</button>`).join('');
  $('histo-chips').innerHTML = HCATS.map(([k, l]) => `<button class="chip ${histo.cat === k ? 'on' : ''}" onclick="histoSet('cat','${k}')">${l} (${count[k]})</button>`).join('');
  if (histo.cat === 'archives') { $('histo-body').innerHTML = archivesHTML(c); return; }
  const rows = all.filter(r => histo.cat === 'all' || r.cat === histo.cat);
  const tcmp = (a, b) => a.h.t < b.h.t ? 1 : a.h.t > b.h.t ? -1 : 0;
  if (histo.sort === 'student') rows.sort((a, b) => alphaCmp(a.s, b.s) || tcmp(a, b)); else rows.sort(tcmp);
  const sum = list => list.reduce((a, r) => a + r.h.delta, 0);
  const gained = sum(rows.filter(r => r.cat === 'gain')), lost = sum(rows.filter(r => r.cat === 'loss'));
  if (!rows.length) { $('histo-body').innerHTML = '<div class="empty" style="padding:30px 10px">Aucun événement pour ce filtre.</div>'; return; }
  const dayOf = t => new Date(t).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  const timeOf = t => new Date(t).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  const shortDate = t => new Date(t).toLocaleDateString('fr-FR', {day:'numeric', month:'short'}) + ' ' + timeOf(t);
  const delta = h => h.delta ? `<b class="hd ${h.delta > 0 ? 'pos' : 'neg'}">${h.delta > 0 ? '+' : '−'}${Math.abs(h.delta)}</b>` : '<span class="hd"></span>';
  const shown = rows.slice(0, histo.limit);
  let html = `<div class="prev">${rows.length} événement${pl(rows.length, '', 's')}${gained ? `, +${gained} XP gagnés` : ''}${lost ? `, ${lost} XP perdus` : ''}</div>`, last = '';
  shown.forEach(r => {
    const grp = histo.sort === 'student' ? r.s.id : dayOf(r.h.t);
    if (grp !== last) {
      last = grp;
      if (histo.sort === 'student') {
        const mine = rows.filter(x => x.s === r.s);
        const g = sum(mine.filter(x => x.cat === 'gain')), l = sum(mine.filter(x => x.cat === 'loss'));
        html += `<div class="hhead"><span><b>${esc(r.s.nom)}</b> ${esc(r.s.prenom)}</span><span>${g ? '+' + g : ''}${g && l ? ' ' : ''}${l ? l : ''}</span></div>`;
      } else html += `<div class="hhead"><span>${esc(dayOf(r.h.t))}</span></div>`;
    }
    html += histo.sort === 'student'
      ? `<div class="hrow"><span class="hb ${r.cat}">${HLABEL[r.cat]}</span><div class="ht">${esc(r.h.label)}<small>${shortDate(r.h.t)}</small></div>${delta(r.h)}</div>`
      : `<div class="hrow"><span class="hb ${r.cat}">${HLABEL[r.cat]}</span><div class="ht"><b>${esc(r.s.nom)}</b> ${esc(r.s.prenom)}<small>${esc(r.h.label)}, ${timeOf(r.h.t)}</small></div>${delta(r.h)}</div>`;
  });
  if (rows.length > shown.length) html += `<button class="btn wide" onclick="histo.limit+=80;renderHisto()">Afficher plus (${rows.length - shown.length} restants)</button>`;
  $('histo-body').innerHTML = html;
}

/* ===================== GÉNÉRATEUR DE PLAN (ÎLOTS CLASSIQUES) ===================== */
/* Score à minimiser : déséquilibre des XP, binômes à séparer réunis, déséquilibre F/M */
function genScore(order, asg, W, ctx) {
  const isl = ILOTS.map(() => ({xp: 0, F: 0, M: 0, n: 0}));
  order.forEach((st, i) => { const k = asg[i]; isl[k].xp += st.xp; isl[k].n++; if (st.genre === 'F') isl[k].F++; if (st.genre === 'M') isl[k].M++; });
  const mean = ctx.totalXP / ILOTS.length, scale = Math.max(1, mean);
  let xpCost = 0; isl.forEach(x => { const d = (x.xp - mean) / scale; xpCost += d * d; });
  const n = Math.max(1, order.length), meanN = n / ILOTS.length;
  let countCost = 0; isl.forEach(x => { const d = (x.n - meanN); countCost += d * d; }); countCost /= (n * n);
  let sepCost = 0; ctx.pairs.forEach(([i, j]) => { if (asg[i] === asg[j]) sepCost++; });
  let mixCost = 0; isl.forEach(x => { mixCost += Math.abs(x.F - x.M); });
  let capCost = 0; if (ctx.cap) isl.forEach(x => { const o = Math.max(0, x.n - ctx.cap); capCost += o * o; });

e l'outil, sans l'ouvrir."], ["Podium", "Le top 5 de la classe, en barres de couleur : émeraude (1er), platine (2e), or (3e), argent (4e), bronze (5e). Les ex æquo sont tous affichés."], ["Liste des élèves", "Sur iPad, les élèves sont en vignettes : prénom en gros, XP en dessous, et une petite icône fille ou garçon si le genre est renseigné. Sur iPhone, une ligne par élève. Le tri par défaut est par nom de famille."], ["Gagner des XP", "Touche un élève : la grille de conditions s'ouvre en petite fenêtre au-dessus du menu. Touche une condition pour l'attribuer. La fenêtre reste ouverte pour enchaîner plusieurs gains. Un halo vert confirme le gain."], ["Retirer des XP", "Dans la fiche de l'élève, le bouton − XP ouvre une grille de retrait séparée, avec les conditions négatives et un montant libre (motif facultatif). Un halo rouge confirme le retrait."], ["Annuler", "Après un gain, un bouton Annuler apparaît pendant environ 6 secondes. Il annule le dernier gain seulement."], ["Fiche", "Le bouton Fiche de la grille ouvre la fiche de l'élève (voir la rubrique Élève)."], ["Bouton « Dernier élève »", "En bas à droite, il rappelle le dernier élève modifié (XP, absence ou fiche). Un appui ouvre sa fiche."], ["Plan", "Le bouton Plan ouvre le plan de la classe dans un écran séparé, plein écran, fermé par la croix. Le type de plan (îlots A à F, ou personnalisé) se règle dans Réglages, Apparence, Formule du plan. Les élèves non placés sont dans la zone Non placés, au-dessus des îlots. Sur le plan classique : Générer propose une répartition selon les équilibres d'XP, les binômes et la mixité ; rien n'est écrit avant Appliquer. La capacité maximale par îlot se règle avec le bouton Max."], ["Présentation", "Le bouton écran ouvre la présentation, en paysage sur iPad : le total d'XP et le nom de la classe en haut, puis les widgets. La zone des noms est à gauche, avec un bouton Réduire : elle se replie en une bande étroite (bouton Noms), et les six widgets se partagent alors l'écran. /* ===================== MINUTEUR ===================== */
const TIMER_SOUNDS = [['bip', 'Bip'], ['cloche', 'Cloche'], ['carillon', 'Carillon'], ['douce', 'Tonalité douce']];
let timerEnd = 0, timerRun = false, timerTick = null, timerAlarmLoop = null, timerMin = 5, audioCtx = null;
const timerSoundId = () => lsGet('jokers_xp_timer_sound') || 'bip';
const timerSoundLabel = () => (TIMER_SOUNDS.find(x => x[0] === timerSoundId()) || TIMER_SOUNDS[0])[1];
function audioOn() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}
const TIMER_VOL = [0.2, 0.4, 0.7, 1.0, 1.4];   /* niveaux 1 à 5 : facteur appliqué à chaque son */
const timerVolLevel = () => { const v = parseInt(lsGet('jokers_xp_timer_vol'), 10); return v >= 1 && v <= 5 ? v : 3; };
function playTimerSound(id) {
  const ac = audioOn(); if (!ac) return;
  const t0 = ac.currentTime;
  const k = TIMER_VOL[timerVolLevel() - 1];
  const tone = (f, start, dur, type, vol0) => {
    const vol = vol0 * k;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0 + start);
    g.gain.linearRampToValueAtTime(vol, t0 + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + start + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0 + start); o.stop(t0 + start + dur + 0.05);
  };
  const pat = {
    bip: () => { for (let i = 0; i < 3; i++) tone(880, i * 0.45, 0.3, 'square', 0.15); },
    cloche: () => { [523, 784, 1046].forEach((f, i) => tone(f, i * 0.25, 1.6, 'sine', 0.22)); },
    carillon: () => { [659, 784, 988, 784].forEach((f, i) => tone(f, i * 0.32, 0.5, 'triangle', 0.22)); },
    douce: () => { [392, 494, 587].forEach((f, i) => tone(f, i * 0.6, 1.2, 'sine', 0.14)); }
  };
  (pat[id] || pat.bip)();
}
function timerLeft() { return Math.max(0, timerEnd - Date.now()); }
function fmtClock(ms) { const t = Math.ceil(ms / 1000), m = Math.floor(t / 60), x = t % 60; return String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); }
function openTimer() {
  if (pressCid) setTimeout(renderPress, 0);
  if (!$('timerscreen')) {
    const el = document.createElement('div');
    el.id = 'timerscreen'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Minuteur');
    document.body.appendChild(el);
  }
  renderTimer();
  $('timerscreen').classList.add('open');
  document.body.classList.add('lock');
}
function closeTimer() {
  if (pressCid) setTimeout(renderPress, 0);
  const el = $('timerscreen'); if (el) el.classList.remove('open', 'alarm');
  document.body.classList.remove('lock');
  renderTimerPill();
}
function renderTimer() {
  const el = $('timerscreen'); if (!el) return;
  const done = !timerRun && timerEnd && timerLeft() === 0;
  const presets = [1, 5, 10, 15, 20, 30].map(m => `<button class="chip ${timerMin === m && !timerRun ? 'on' : ''}" ${timerRun ? 'disabled' : ''} onclick="setTimerMin(${m})">${m} min</button>`).join('');
  el.classList.toggle('finished', !!done);
  el.innerHTML = `<div class="tshead"><button class="back" onclick="closeTimer()">Retour</button></div>
    <div class="tdisp" id="tdisp">${done ? 'Terminé' : fmtClock(timerRun ? timerLeft() : timerMin * 60000)}</div>
    ${timerRun || done ? '' : `<div class="tpresets">${presets}</div>
    <label class="tcustom">Autre durée (minutes)<input id="tminin" type="number" min="1" max="240" value="${timerMin}" onchange="setTimerMin(this.value)"></label>`}
    <div class="tbtns">
      ${done ? `<button class="btn primary wide" onclick="stopTimerAlarm()">Arrêter le son</button>`
        : timerRun ? `<button class="btn wide" onclick="cancelTimer()">Arrêter le minuteur</button>`
        : `<button class="btn primary wide" onclick="startTimer()">Démarrer</button>`}
    </div>`;
}
function setTimerMin(v) {
  const n = Math.min(240, Math.max(1, parseInt(v, 10) || 1));
  timerMin = n; renderTimer();
}
function startTimer() {
  if (pressCid) setTimeout(renderPress, 0);
  audioOn();
  timerEnd = Date.now() + timerMin * 60000; timerRun = true;
  clearInterval(timerTick); timerTick = setInterval(timerUpdate, 250);
  renderTimer(); renderTimerPill();
}
function cancelTimer() {
  if (pressCid) setTimeout(renderPress, 0);
  timerRun = false; timerEnd = 0; clearInterval(timerTick); stopAlarmLoop();
  renderTimer(); renderTimerPill();
}
function timerUpdate() {
  if (timerRun && timerLeft() <= 0) { timerFinish(); return; }
  const d = $('tdisp'); if (d && timerRun) d.textContent = fmtClock(timerLeft());
  const wt = $('wtimer'); if (wt && timerRun) wt.textContent = fmtClock(timerLeft());
  renderTimerPill();
}
function timerFinish() {
  if (pressCid) setTimeout(renderPress, 0);
  timerRun = false; clearInterval(timerTick);
  const el = $('timerscreen');
  if (el && el.classList.contains('open')) el.classList.add('alarm');
  playTimerSound(timerSoundId());
  clearInterval(timerAlarmLoop);
  timerAlarmLoop = setInterval(() => playTimerSound(timerSoundId()), 2600);
  if (el && el.classList.contains('open')) renderTimer();
  renderTimerPill();
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
}
function stopAlarmLoop() { clearInterval(timerAlarmLoop); timerAlarmLoop = null; }
function stopTimerAlarm() {
  stopAlarmLoop(); timerEnd = 0;
  const el = $('timerscreen'); if (el) el.classList.remove('alarm');
  renderTimer(); renderTimerPill();
}
/* Pastille « minuteur » quand l'écran est fermé et que le minuteur tourne ou sonne */
function renderTimerPill() {
  let p = $('timerpill');
  const show = !($('timerscreen') && $('timerscreen').classList.contains('open')) && (timerRun || timerAlarmLoop);
  if (!show) { if (p) p.remove(); return; }
  if (!p) { p = document.createElement('button'); p.id = 'timerpill'; p.onclick = openTimer; document.body.appendChild(p); }
  p.className = timerAlarmLoop ? 'alarming' : '';
  p.textContent = timerAlarmLoop ? 'Minuteur terminé : toucher pour arrêter' : '⏱ ' + fmtClock(timerLeft());
}
/* Réglage du son du minuteur */
function setTimerSound(id) {
  lsSet('jokers_xp_timer_sound', id); playTimerSound(id); openSettingsPage('sontimer');
}
function setTimerVol(n) { lsSet('jokers_xp_timer_vol', String(n)); playTimerSound(timerSoundId()); openSettingsPage('sontimer'); }
function timerSoundsHTML() {
  const lv = timerVolLevel();
  return `<p class="muted" style="font-size:14px;margin-bottom:12px">Choisis le son de fin de minuteur. Touche un son pour l'écouter.</p>`
    + TIMER_SOUNDS.map(([id, label]) => `<div class="cond" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><button class="chip ${timerSoundId() === id ? 'on' : ''}" onclick="setTimerSound('${id}')">${esc(label)}</button><button class="chip" aria-label="Écouter ${esc(label)}" onclick="playTimerSound('${id}')">Écouter</button></div>`).join('')
    + `<h3 style="margin:18px 0 8px">Puissance sonore</h3><p class="muted" style="font-size:13px;margin-bottom:10px">Du niveau 1 (très doux) au niveau 5 (très fort).</p><div class="tpresets">`
    + [1, 2, 3, 4, 5].map(n => `<button class="chip ${lv === n ? 'on' : ''}" aria-label="Puissance ${n} sur 5" onclick="setTimerVol(${n})">${n}</button>`).join('')
    + `</div>`;
}

/* ===================== TIRAGE AU SORT ===================== */
let drawSt = null, drawBusy = false;
function drawPool() {
  const c = getClass(drawSt.cid);
  return c.students.filter(x => !drawSt.off.includes(x.id) && !drawSt.drawn.includes(x.id));
}
const DRAW_HOUR = 3600000;
function drawKey(cid) { return 'jokers_xp_draw_' + cid; }
function drawLoad(cid) {
  const c = getClass(cid);
  let d = {drawn: [], startedAt: 0, askedHour: false};
  try { const raw = lsGet(drawKey(cid)); if (raw) d = {...d, ...JSON.parse(raw)}; } catch (e) {}
  const ids = new Set(c.students.map(x => x.id));
  d.drawn = (d.drawn || []).filter(id => ids.has(id));
  return {cid, off: c.students.filter(isAbsent).map(x => x.id), drawn: d.drawn, startedAt: d.startedAt || 0, askedHour: !!d.askedHour, last: null};
}
function drawSave() {
  if (!drawSt) return;
  if (!drawSt.drawn.length) { lsSet(drawKey(drawSt.cid), null); return; }
  lsSet(drawKey(drawSt.cid), JSON.stringify({drawn: drawSt.drawn, startedAt: drawSt.startedAt, askedHour: drawSt.askedHour}));
}
function openDraw(cid) {
  if (!drawSt || drawSt.cid !== cid) drawSt = drawLoad(cid);
  drawPrep();
}
function drawToggle(sid, on) {
  drawSt.off = on ? drawSt.off.filter(id => id !== sid) : [...drawSt.off, sid];
  drawPrep();
}
function drawPrep() {
  const c = getClass(drawSt.cid), pool = drawPool();
  const rows = c.students.map(x => {
    const drawnAlready = drawSt.drawn.includes(x.id);
    const checked = !drawSt.off.includes(x.id) && !drawnAlready;
    return `<label class="drawrow ${drawnAlready ? 'done' : ''}"><input type="checkbox" ${checked ? 'checked' : ''} ${drawnAlready ? 'disabled' : ''} onchange="drawToggle('${x.id}', this.checked)"><span>${esc(x.prenom || '')} <b>${esc(x.nom)}</b></span>${isAbsent(x) ? '<small>absent</small>' : ''}${drawnAlready ? '<small>déjà tiré</small>' : ''}</label>`;
  }).join('');
  openSheet(`<div class="shead"><b>Tirage au sort</b></div>
    <p class="muted" style="font-size:14px">${pool.length} élève${pool.length > 1 ? 's' : ''} dans le tirage. Les absents sont décochés par défaut ; décoche ou recoche qui tu veux.</p>
    <div class="drawlist">${rows}</div>
    <div class="drawbtns"><button class="btn primary wide" ${pool.length ? '' : 'disabled'} onclick="drawGo()">Tirer au sort</button>${drawSt.drawn.length ? '<button class="btn wide" onclick="drawReset()">Réinitialiser les noms</button>' : ''}</div>`);
}
function drawGo() {
  if (drawBusy) return;
  const pool = drawPool();
  if (!pool.length) { drawEmpty(); return; }
  if (drawSt.drawn.length && drawSt.startedAt && !drawSt.askedHour && Date.now() - drawSt.startedAt >= DRAW_HOUR) { drawAskHour(); return; }
  drawBusy = true;
  const c = getClass(drawSt.cid);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  const box = `<div class="drawbox" id="drawbox"></div>`;
  openSheet(`<div class="shead"><b>Tirage au sort</b></div>${box}<div class="drawbtns" id="drawbtns"></div>`);
