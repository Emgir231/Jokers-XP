<style>
@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap');
:root{
  --menu-bg:#F4F6FF; --menu-on:#EEF1FF; --menu-active:#E6EAFB; --menu-txt:var(--acc-txt);
  --acc-ink:#fff; --acc-txt:var(--primary); --acc-b1:var(--primary); --acc-b2:var(--primary); --acc-hi:var(--primary); --plus:#3E9B6C; --plus-d:#2F7A55; --minus:#B8443E; --minus-d:#8C322D;
  --bg:#F3F4F9; --grid:#E4E7F1; --surface:#fff; --ink:#2A2E4A; --soft:#6C7190; --line:#DADFEE;
  --primary:#5766B8; --primary-d:#434F96;
  --mint:#3E9B6C; --mint-d:#2F7A55; --coral:#C45B57; --coral-d:#A24541;
  --sun:#D6A63A;
  --green:#4E9A72; --blue:#4A7FBF; --violet:#7E6BB4; --special:#C8A23A;
  --green-bg:#E6F1EA; --blue-bg:#E4ECF6; --violet-bg:#ECE8F4; --special-bg:#F6EFD6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.35;min-height:100vh}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
#app{padding:0 max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:640px;margin:0 auto}
h1,h2,h3,p{margin:0}
.muted{color:var(--soft)}

/* Boutons épais façon cahier d'exercices */
.btn{border:0;border-radius:16px;padding:13px 18px;font-weight:800;background:var(--surface);color:var(--ink);
  box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--line)}
.btn.primary{background:var(--primary);color:var(--acc-ink);box-shadow:0 4px 0 var(--primary-d)}
.btn.primary:active{box-shadow:0 1px 0 var(--primary-d)}
.btn.mint{background:var(--mint);color:var(--acc-ink);box-shadow:0 4px 0 var(--mint-d)}
.btn.mint:active{box-shadow:0 1px 0 var(--mint-d)}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d)}
.btn.coral:active{box-shadow:0 1px 0 var(--coral-d)}
.btn.danger{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d)}
.btn.danger-o{color:var(--coral-d)}
.btn.wide{width:100%;margin-top:18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon{border:0;background:var(--surface);border-radius:14px;width:44px;height:44px;font-size:20px;font-weight:800;
  box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}

/* Accueil */
.hero{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 26px) 0 14px}
.hero h1{font-size:36px;font-weight:900;letter-spacing:-.5px}
.hero p{color:var(--soft);font-weight:700;margin-top:2px}
.banner{display:block;width:100%;text-align:left;border:0;border-radius:18px;padding:12px 14px;margin:6px 0 4px;
  background:var(--special-bg);box-shadow:inset 0 0 0 2px #FFE08A;font-weight:700}
.group{margin-top:22px}
.group h2{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.group h2 small{font-size:13px;color:var(--soft);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:14px}
.ccard{position:relative;border-radius:24px;padding:16px 14px 16px;background:var(--lvbg);
  box-shadow:inset 0 0 0 2.5px var(--lv),0 6px 0 var(--lv);min-height:128px;cursor:pointer;transition:transform .08s}
.ccard:active{transform:translateY(4px);box-shadow:inset 0 0 0 2.5px var(--lv),0 2px 0 var(--lv)}
.ccard .cname{font-size:26px;font-weight:900;color:var(--lvd);padding-right:30px;word-break:break-word;line-height:1.1}
.ccard .cmeta{margin-top:8px;font-weight:700;color:var(--ink)}
.ccard .cxp{margin-top:2px;font-weight:700;color:var(--soft)}
.ccard .cxp b{color:var(--ink);font-size:18px}
.ccard .more{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:12px;background:#ffffffaa;font-size:18px;font-weight:900;color:var(--lvd)}
.bar .bt b{color:var(--lvd,var(--ink))}
.bar .back{color:var(--lvd,var(--primary-d))}

.empty{text-align:center;padding:50px 20px;color:var(--soft);font-weight:700}
.empty .big{font-size:56px;margin-bottom:8px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:5;padding:16px 26px;font-size:17px}
.fab:active{transform:translateX(-50%) translateY(3px)}

/* Page classe */
.bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 0 10px;background:linear-gradient(var(--bg) 82%,transparent)}
.back{border:0;background:var(--surface);border-radius:14px;height:44px;padding:0 14px;font-weight:800;color:var(--primary-d);
  box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.bt{flex:1;min-width:0;text-align:center}
.bt b{display:block;font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small{display:block;color:var(--soft);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.actions .btn{padding:12px 8px}
.sorts{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px}
.chip{flex:none;border:0;border-radius:999px;padding:9px 15px;font-weight:800;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.chip.on{background:var(--primary);color:var(--acc-ink);box-shadow:0 3px 0 var(--primary-d)}
.search{width:100%;border:0;border-radius:16px;padding:13px 16px;font-size:16px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);margin:4px 0 14px;outline:none}
.search:focus,input:focus,textarea:focus,select:focus{box-shadow:inset 0 0 0 2.5px var(--primary)}

/* Podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:6px 0 18px;padding:0 6px}
.pl{flex:1;max-width:118px;text-align:center}
.pl .av{width:50px;height:50px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-weight:900;font-size:18px;background:var(--surface);box-shadow:inset 0 0 0 3px var(--pc)}
.pl .pn{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pt{font-size:12px;font-weight:800;color:var(--soft);margin-bottom:4px}
.pl .blk{background:var(--pc);border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:8px;font-size:26px;
  box-shadow:inset 0 -4px 0 #0000001a}

.prof{position:absolute;left:50%;margin-left:-96px;top:-2px;width:192px;height:20px;transform:scale(.78);transform-origin:50% 50%;border:0;background:transparent;font-size:16px;line-height:20px;font-weight:700;color:var(--soft);padding:0 3px;outline:none;box-shadow:none;border-radius:4px;text-align:center}

.notearea{display:block;width:100%;border:0;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.4;background:var(--menu-bg);box-shadow:inset 0 0 0 2px var(--line);outline:none;resize:vertical;min-height:110px;color:var(--ink);font-family:inherit;margin-bottom:6px}
.asum .nt{font-size:13px;color:var(--soft);font-weight:700;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.ntic{opacity:.55;color:var(--soft)}
.shead.stick{position:sticky;top:-8px;z-index:3;background:var(--surface);margin:-8px -18px 10px;padding:10px 18px 8px;align-items:center}
.sclose{position:sticky;top:0;height:0;z-index:5}
.sclose button{position:absolute;right:0;top:-2px;width:34px;height:34px;border-radius:50%;border:0;background:#EEF0FA;color:var(--soft);display:grid;place-items:center;padding:0}
.sclose .ic{width:18px;height:18px}

.ccard .cprof{font-size:12px;font-weight:700;opacity:.85;margin-top:1px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
/* ===== Style Vero (sombre, turquoise) ===== */

/* ===== Grands écrans (PC, iPad en paysage) : à partir de 1000 px de large uniquement. Aucun effet sur iPhone. ===== */

/* ===== Choix du mode ===== */
.mic{display:grid;place-items:center;height:30px}

/* Dialogue et toast */
.dlg{position:fixed;z-index:61;left:20px;right:20px;top:50%;transform:translateY(-50%);max-width:420px;margin:0 auto;background:var(--surface);border-radius:26px;padding:22px 20px 18px;
  box-shadow:0 8px 0 #0000001a}

  background:var(--ink);color:#fff;font-weight:800;border-radius:999px;padding:11px 20px;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.undo{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:9px 9px 9px 20px}
#toast .ub{background:transparent;color:inherit;border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:900;cursor:pointer;box-shadow:inset 0 0 0 2px currentColor}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

.tg,.cbadge{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:6px}
.sw{aspect-ratio:1;width:100%;border:0;border-radius:50%;background:var(--sc);box-shadow:inset 0 0 0 2px #00000026;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}

/* ===== Style Ubuntu : plat, angles arrondis, police Ubuntu, clair et sombre ===== */

  --acc-ink:#111111; --acc-txt:#B5401A; --acc-b1:var(--primary); --acc-b2:var(--primary); --acc-hi:var(--primary);
  --plus:#26A269; --plus-d:#26A269; --minus:#E01B24; --minus-d:#E01B24;
  --bg:#fafafa; --grid:transparent; --surface:#ffffff; --surface-2:#f0f0ee; --ink:#2c2c2c; --soft:#77767b; --line:#e3e3e1; --line-2:#cfcfcd;
  --primary:#E95420; --primary-d:#E95420; --mint:#E95420; --mint-d:#E95420; --teal:#E95420; --coral:#E01B24; --coral-d:#E01B24;
  --radius:12px;
  background-color:var(--bg); background-image:none; color:var(--ink);
  font-family:'Ubuntu',system-ui,-apple-system,'Segoe UI',sans-serif;
}

body[data-theme=ubuntu] .tagchip.on{background:var(--surface-2)}

#toast .ubar{position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;overflow:hidden;opacity:.35}

/* Animations d'entrée par style (classes et élèves) */
@keyframes enterPop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}

  body > *:not(#printzone){display:none !important}
  #printzone{display:block !important;position:static;color:#000;background:#fff;font-family:Georgia,'Times New Roman',serif;padding:0}

}

/* Menus en sombre : fonds foncés, texte clair */
body[data-theme=ubuntu][data-mode=dark],body[data-mode=oled],body[data-theme=vero],body[data-theme=cockpit]{--menu-bg:var(--surface-2);--menu-on:var(--line-2);--menu-active:var(--line);--menu-txt:var(--ink)}

  let disc = 0, from = null;

function quickGain(cid, sid) {

/* Événements de la séance du jour (gains, retraits, achats) */
/* Demi-journées : matin jusqu'à 13 h, après-midi ensuite (les créneaux 8 h-12 h 50 et 13 h 10-18 h tombent dedans) */
function sessionKey(t) {
  const d = new Date(t), m = d.getHours() * 60 + d.getMinutes();
  return d.toDateString() + (m < 13 * 60 ? ' matin' : ' après-midi');
}
/* Séance en cours = demi-journée de la dernière attribution d'XP de la classe */
function currentSession(c) {
  let latest = null;
  c.students.forEach(s => s.history.forEach(h => { if (h.kind === 'gain' && h.delta > 0 && (!latest || h.t > latest)) latest = h.t; }));
  return sessionKey(latest || new Date().toISOString());
}
/* Participation : nombre d'attributions d'XP dans la séance donnée */
function participation(s, key) {
  return s.history.filter(h => h.kind === 'gain' && h.delta > 0 && sessionKey(h.t) === key).length;
}
/* Jauge vers le prochain palier (8, 22, 50 XP) */
const PALIERS = [8, 22, 50];
function pgBar(s) {
  const next = PALIERS.find(p => s.xp < p);
  const prev = Math.max(0, ...PALIERS.filter(p => p <= s.xp));
  const pct = next ? Math.min(100, Math.max(0, Math.round(((s.xp - prev) / (next - prev)) * 100))) : 100;
  const label = next ? `Prochain palier : ${next} XP` : 'Palier maximal atteint';
  return `<div class="pgbar" title="${label}" aria-label="${label}"><i style="width:${pct}%"></i></div>`;
}

function rowHTML(c, s, anchor) {

    + (ranked.length > MAXDOTS ? `<span class="dot more">+${ranked.length - MAXDOTS}</span>` : '');
  return `<div class="row ${ab ? 'abs' : ''} ${bl ? 'blk' : ''}" ${anchor || ''} onclick="${view.quick ? `quickGain('${c.id}','${s.id}')` : `openStudent('${c.id}','${s.id}')`}">${ilotBadge(c, s)}

/* Plan de classe : 6 îlots en 2 colonnes et 3 lignes (A bas droite, B bas gauche, C au-dessus de A, D au-dessus de B, E au-dessus de C, F au-dessus de D) */
const PLAN_ORDER = ['F', 'E', 'D', 'C', 'B', 'A'];
function planBoardHTML(c) {
  const chip = s => `<button class="pchip" data-sid="${s.id}" onpointerdown="planDown(event,'${c.id}','${s.id}')">${esc(s.nom)} ${esc(s.prenom)}</button>`;
  const zone = l => { const list = c.students.filter(s => (s.ilot || '') === l); return `<div class="pzone" data-zone="${l}" style="${ilotStyle(l)}"><div class="pzh"><b>${l}</b><small>${list.length}</small></div><div class="pzb">${list.map(chip).join('')}</div></div>`; };
  const none = c.students.filter(s => !s.ilot || !ILOTS.includes(s.ilot));
  const bac = `<div class="pzone pbac" data-zone=""><div class="pzh"><b>Non placés</b><small>${none.length}</small></div><div class="pzb">${none.map(chip).join('')}</div></div>`;
  return `${bac}<div class="pgrid">${PLAN_ORDER.map(zone).join('')}</div>`;
}
let pdrag = null;
function planDown(e, cid, sid) {
  if (e.button > 0) return;
  pdrag = {cid, sid, x0: e.clientX, y0: e.clientY, moved: false, ghost: null};
  window.addEventListener('pointermove', planMove);
  window.addEventListener('pointerup', planUp);
  window.addEventListener('pointercancel', planEnd);
}
function zoneAt(x, y) { const el = document.elementFromPoint(x, y); return el ? el.closest('[data-zone]') : null; }
function planMove(e) {
  if (!pdrag) return;
  if (!pdrag.moved) {
    if (Math.hypot(e.clientX - pdrag.x0, e.clientY - pdrag.y0) < 8) return;
    pdrag.moved = true;
    const src = document.querySelector(`.pchip[data-sid="${pdrag.sid}"]`);
    const g = document.createElement('div'); g.className = 'pghost'; g.textContent = src ? src.textContent : '';
    document.body.appendChild(g); pdrag.ghost = g;
  }
  e.preventDefault();
  pdrag.ghost.style.left = e.clientX + 'px'; pdrag.ghost.style.top = e.clientY + 'px';
  const z = zoneAt(e.clientX, e.clientY);
  document.querySelectorAll('.pzone.over').forEach(n => { if (n !== z) n.classList.remove('over'); });
  if (z) z.classList.add('over');
}
function planUp(e) {
  const d = pdrag;
  planEnd();
  if (!d) return;
  if (!d.moved) { assignIlot(d.cid, d.sid); return; }
  const z = zoneAt(e.clientX, e.clientY);
  if (!z) return;
  const s = getStudent(getClass(d.cid), d.sid);
  s.ilot = z.dataset.zone || null;
  save(); refreshPlan();
}
function planEnd() {
  pdrag = null;
  window.removeEventListener('pointermove', planMove);
  window.removeEventListener('pointerup', planUp);
  window.removeEventListener('pointercancel', planEnd);
  document.querySelectorAll('.pghost').forEach(n => n.remove());
  document.querySelectorAll('.pzone.over').forEach(n => n.classList.remove('over'));
}
function renderList() {
  const c = getClass(view.id), wrap = $('listwrap');
  if (!c || !wrap) return;
  if (view.plan) { wrap.innerHTML = planBoardHTML(c); return; }
  let list = c.students.slice();
  const q = norm(view.q || '');
  if (q) list = list.filter(s => norm(nameOf(s)).includes(q));
  const tf = view.appel ? [] : (view.tags || []);
  if (tf.length) list = list.filter(matchTags);
  const banner = tf.length ? `<div class="prev" style="margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Filtre : ${tf.map(id => tagIcon(tagDef(id) || {})).join('')} (${list.length} élève${pl(list.length, '', 's')})</span><button class="chip" onclick="clearTagFilter()">✕ Effacer</button></div>` : '';
  const alpha = (a, b) => a.nom.localeCompare(b.nom, 'fr') || a.prenom.localeCompare(b.prenom, 'fr');
  if (view.sort === 'xp') list.sort((a, b) => b.xp - a.xp || alpha(a, b));
  else if (view.sort === 'xpa') list.sort((a, b) => a.xp - b.xp || alpha(a, b));
  else if (view.sort === 'cards') list.sort((a, b) => unusedCards(b).length - unusedCards(a).length || alpha(a, b));
  else if (view.sort === 'discret') { const key = currentSession(c); list.sort((a, b) => participation(a, key) - participation(b, key) || alpha(a, b)); }
  else if (view.sort === 'ilot') list.sort((a, b) => ilotRank(a) - ilotRank(b) || alpha(a, b));
  else list.sort(alpha);
  if (!list.length) {
    wrap.innerHTML = c.students.length
      ? `${banner}<div class="empty">Aucun élève ne correspond à ${tf.length ? 'ce filtre' : 'cette recherche'}.</div>`
      : `<div class="empty"><div class="big">${ico('users')}</div>Cette classe est vide.<br>Importe une liste ou ajoute un élève.</div>`;
    return;
  }
  const showIdx = false;
  const seen = {}, letters = [];
  const rows = list.map(s => {
    let a = '';
    if (showIdx) { const L = letterOf(s); if (!seen[L]) { seen[L] = 1; letters.push(L); a = `data-l="${L}"`; } }
    return rowHTML(c, s, a);
  }).join('');
  const idx = showIdx ? `<div class="index" ontouchstart="idxGo(event)" ontouchmove="idxGo(event)">${letters.map(L => `<span data-i="${L}" onclick="jumpTo('${L}')">${L}</span>`).join('')}</div>` : '';
  wrap.innerHTML = `${banner}<div class="listbox ${showIdx ? 'idx' : ''}">${rows}${idx}</div>`;
}

function jumpTo(L) {
  const el = document.querySelector(`.row[data-l="${L}"]`);
  if (el) el.scrollIntoView({block:'start'});
}
function idxGo(e) {
  const t = e.touches ? e.touches[0] : e;
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if (el && el.dataset && el.dataset.i) jumpTo(el.dataset.i);
}

/* ============ Feuilles, dialogue, toast ============ */
let sheetSeq = 0;
function openSheet(html) {
  sheetSeq++;
  const hasExit = /aria-label="Fermer"|class="back"/.test(html);
  $('layer').innerHTML = `<div class="backdrop" onclick="closeSheet()"></div><div class="sheet" role="dialog">${hasExit ? '' : `<div class="sclose"><button aria-label="Fermer" onclick="closeSheet()">${ico('x')}</button></div>`}${html}</div>`;
  document.body.classList.add('lock');
}
function closeSheet() {
  const L = $('layer');
  document.body.classList.remove('lock');
  if (theme !== 'vero' || !L.innerHTML) { L.innerHTML = ''; return; }
  /* style Vero : la feuille se referme en douceur (~450 ms) */
  const my = ++sheetSeq, sh = L.querySelector('.sheet'), bk = L.querySelector('.backdrop');
  if (sh) sh.classList.add('out'); if (bk) bk.classList.add('out');
  setTimeout(() => { if (my === sheetSeq) L.innerHTML = ''; }, 560);
}
function confirmDialog(title, text, ok = 'Confirmer', danger = false) {
  return new Promise(res => {
    $('dialog').innerHTML = `<div class="backdrop dim"></div><div class="dlg" role="alertdialog"><h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="dbtns"><button class="btn" id="dn">Annuler</button><button class="btn ${danger ? 'danger' : 'primary'}" id="dy">${esc(ok)}</button></div></div>`;
    $('dn').onclick = () => { $('dialog').innerHTML = ''; res(false); };
    $('dy').onclick = () => { $('dialog').innerHTML = ''; res(true); };
  });
}
let tt;
function toast(m) {
  const t = $('toast'); pendingUndo = null; clearTimeout(undoTimer); t.classList.remove('undo'); t.textContent = m; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200);
}
function done(msg, u) { save(); closeSheet(); render(); if (u) showUndo(msg, u); else if (msg) toast(msg); }
function newEvId() { try { if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {} return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 11); }
function logH(s, label, delta, kind) { s.history.push({id: newEvId(), t:new Date().toISOString(), label, delta, kind}); }
/* ----- Retours tactiles et annulation ----- */
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
let pendingUndo = null, undoTimer = null;
function snapUndo(students) {
  return {seq: null, snaps: students.map(s => ({s, xp: s.xp, total: s.total, uses: JSON.parse(JSON.stringify(s.uses || {})), cards: JSON.parse(JSON.stringify(s.cards || [])), blockedUntil: s.blockedUntil, hlen: s.history.length}))};
}
function hideUndo() {
  clearTimeout(undoTimer); undoTimer = null; pendingUndo = null;
  const t = $('toast'); t.classList.remove('on', 'undo'); t.innerHTML = '';
}
function showUndo(msg, u) {
  const t = $('toast');
  pendingUndo = u; u.seq = changeSeq;
  clearTimeout(tt);
  t.innerHTML = '';
  const span = document.createElement('span'); span.textContent = msg;
  const b = document.createElement('button'); b.className = 'ub'; b.textContent = 'Annuler'; b.onclick = undoLast;
  const bar = document.createElement('span'); bar.className = 'ubar'; bar.innerHTML = '<i></i>';
  t.append(span, b, bar); t.classList.add('on', 'undo');
  clearTimeout(undoTimer); undoTimer = setTimeout(hideUndo, 4000);
}
function undoLast() {
  const u = pendingUndo; if (!u) return;
  if (changeSeq !== u.seq) { hideUndo(); toast("Annulation impossible : une autre modification a eu lieu"); return; }
  u.snaps.forEach(p => { const s = p.s; s.xp = p.xp; s.total = p.total; s.uses = p.uses; s.cards = p.cards; s.blockedUntil = p.blockedUntil; s.history.length = p.hlen; });
  hideUndo(); save(); render(); toast('Action annulée');
}

let lastChapter = null;
function chapterStart(c) {
  if (c.chapterStart) return c.chapterStart;
  const a = c.chapitres_archives;
  return a.length ? a[a.length - 1].t : '1970-01-01T00:00:00.000Z';
}
function newChapter(id) {
  const c = getClass(id);
  openSheet(`<h2>Passer au chapitre ${c.chapter + 1}</h2>
    <p class="muted">Un bilan du chapitre ${c.chapter} sera archivé dans l'historique. Les XP sont conservés.</p>
    <label>Nom du chapitre ${c.chapter} (pour le bilan)</label><input type="text" id="ch-name" maxlength="60" value="Chapitre ${c.chapter}">
    <label class="ck"><input type="checkbox" id="ch-cards" checked> Marquer les cartes en attente comme utilisées</label>
    <label class="ck"><input type="checkbox" id="ch-uses" checked> Remettre à zéro les compteurs « par chapitre » (1/1, 0/2…)</label>
    <p class="muted" style="margin-top:10px;font-size:14px">Les XP ne sont jamais modifiés. Si tu décoches une option, les cartes ou les compteurs restent tels quels.</p>
    <button class="btn primary wide" onclick="doNewChapter('${id}')">Passer au chapitre suivant</button>`);
}
function doNewChapter(id) {
  const c = getClass(id);
  const name = ($('ch-name').value.trim() || `Chapitre ${c.chapter}`).slice(0, 60);
  const doCards = $('ch-cards').checked, doUses = $('ch-uses').checked;
  const from = chapterStart(c), now = new Date().toISOString();
  const snap = snapUndo(c.students);
  const eleves = c.students.map(s => {
    const inCh = h => h.t >= from;
    const gains = s.history.filter(h => h.kind === 'gain' && inCh(h) && h.delta > 0).reduce((a, h) => a + h.delta, 0);
    const retraits = s.history.filter(h => h.kind === 'loss' && inCh(h)).reduce((a, h) => a + Math.abs(h.delta), 0);
    const achats = s.history.filter(h => h.kind === 'buy' && inCh(h)).length;
    const utilisees = doCards ? s.cards.filter(x => !x.used).length : 0;
    return {id: s.id, nom: s.nom, prenom: s.prenom, gains, retraits, achats, utilisees};
  });
  const total = eleves.reduce((a, e) => a + e.gains, 0);
  const prevLen = c.chapitres_archives.length, prevStart = c.chapterStart;
  c.chapitres_archives.push({id: uid(), t: now, nom: name, debut: from, chapitre: c.chapter, xp: total, eleves});
  c.students.forEach(s => {
    if (doUses) s.uses = {};
    if (doCards) s.cards.forEach(x => {
      if (x.used) return;
      x.used = true;
      logH(s, 'Carte utilisée (fin de chapitre) : ' + ((CARD_BY_ID[x.key] || {}).n || x.key), 0, 'use');
    });
  });
  c.chapter++;
  c.chapterStart = now;
  lastChapter = {cid: id, snap, prevLen, prevStart, chapter: c.chapter - 1, seq: null};
  done(`${c.name} : chapitre ${c.chapter}`);
  lastChapter.seq = changeSeq;
}
function canUndoChapter(cid) { return !!lastChapter && lastChapter.cid === cid && lastChapter.seq === changeSeq; }
function undoChapter(cid) {
  if (!canUndoChapter(cid)) { toast('Annulation impossible : une autre modification a eu lieu'); return; }
  const c = getClass(cid), L = lastChapter;
  L.snap.snaps.forEach(p => { const s = p.s; s.xp = p.xp; s.total = p.total; s.uses = p.uses; s.cards = p.cards; s.blockedUntil = p.blockedUntil; s.history.length = p.hlen; });
  c.chapitres_archives.length = L.prevLen;
  c.chapter = L.chapter;
  if (L.prevStart) c.chapterStart = L.prevStart; else delete c.chapterStart;
  lastChapter = null;
  save(); closeSheet(); render(); toast('Passage de chapitre annulé');
}

/* ============ Élèves ============ */
function newStudent(nom, prenom) {
  return {id:uid(), nom:nom.toUpperCase().trim(), prenom:titleCase(prenom), xp:0, total:0, uses:{}, cards:[], history:[], tags:[], absentDate:null, blockedUntil:null};
}
function openStudentForm(cid, sid) {
  const c = getClass(cid), s = sid ? getStudent(c, sid) : null;
  openSheet(`<h2>${s ? "Modifier l'élève" : 'Ajouter un élève'}</h2>
    <label>Nom de famille</label><input type="text" id="f-nom" autocapitalize="characters" value="${esc(s ? s.nom : '')}">
    <label>Prénom</label><input type="text" id="f-prenom" autocapitalize="words" value="${esc(s ? s.prenom : '')}">
    <button class="btn primary wide" onclick="saveStudent('${cid}','${sid || ''}')">${s ? 'Enregistrer' : 'Ajouter'}</button>`);
}
function saveStudent(cid, sid) {
  const nom = $('f-nom').value.trim(), prenom = $('f-prenom').value.trim();
  if (!nom) { toast('Le nom est obligatoire'); return; }
  const c = getClass(cid);
  if (sid) { const s = getStudent(c, sid); s.nom = nom.toUpperCase(); s.prenom = titleCase(prenom); }
  else c.students.push(newStudent(nom, prenom));
  done(sid ? 'Élève modifié' : 'Élève ajouté');
}
async function delStudent(cid, sid) {
  const c = getClass(cid), s = getStudent(c, sid);
  const ok = await confirmDialog('Supprimer cet élève ?', `${nameOf(s)} sera supprimé définitivement, avec ses XP, ses cartes et son historique.`, 'Supprimer', true);
  if (!ok) return;
  c.students = c.students.filter(x => x.id !== sid);
  done('Élève supprimé');
}

/* ----- Import par copier-coller ----- */
function parseList(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    let nom, prenom;
    if (l.includes(',')) { const i = l.indexOf(','); nom = l.slice(0, i).trim(); prenom = l.slice(i + 1).trim(); }
    else { const p = l.split(/\s+/); nom = p[0]; prenom = p.slice(1).join(' '); }
    return {nom:nom.toUpperCase(), prenom:titleCase(prenom)};
  }).filter(x => x.nom);
}
let impCid = null;
function openImport(cid) {
  impCid = cid;
  openSheet(`<h2>Importer une liste</h2>
    <p class="muted">Un élève par ligne : le premier mot est le nom, le second le prénom. Pour un nom de plusieurs mots, ajoute une virgule : DE LA FONTAINE, Jean</p>
    <label>Colle ta liste ici</label>
    <textarea id="imp-t" placeholder="MARTIN Léa&#10;DURAND Hugo&#10;DE LA FONTAINE, Jean-Pierre" oninput="previewImport()"></textarea>
    <div id="imp-p"></div>
    <button class="btn primary wide" id="imp-b" disabled onclick="doImport()">Importer</button>`);
}
function previewImport() {
  const c = getClass(impCid), list = parseList($('imp-t').value);
  const exists = new Set(c.students.map(s => norm(nameOf(s))));
  const fresh = list.filter(x => !exists.has(norm(`${x.nom} ${x.prenom}`.trim())));
  const dup = list.length - fresh.length;
  $('imp-p').innerHTML = list.length
    ? `<div class="prev"><div>${fresh.length} élève${fresh.length > 1 ? 's' : ''} à ajouter${dup ? `, ${dup} déjà présent${dup > 1 ? 's' : ''} (ignoré${dup > 1 ? 's' : ''})` : ''}</div>
       ${fresh.slice(0, 6).map(x => `<div><b>${esc(x.nom)}</b> ${esc(x.prenom)}</div>`).join('')}${fresh.length > 6 ? `<div class="muted">… et ${fresh.length - 6} autres</div>` : ''}</div>` : '';
  const b = $('imp-b'); b.disabled = !fresh.length;
  b.textContent = fresh.length ? `Importer ${fresh.length} élève${fresh.length > 1 ? 's' : ''}` : 'Importer';
}
function doImport() {
  const c = getClass(impCid), list = parseList($('imp-t').value);
  const exists = new Set(c.students.map(s => norm(nameOf(s))));
  let n = 0;
  list.forEach(x => {
    const k = norm(`${x.nom} ${x.prenom}`.trim());
    if (exists.has(k)) return;
    exists.add(k); c.students.push(newStudent(x.nom, x.prenom)); n++;
  });
  done(`${n} élève${n > 1 ? 's' : ''} importé${n > 1 ? 's' : ''}`);
}

/* ============ Fiche élève ============ */

  const c = getClass(cid), s = getStudent(c, sid);
  if (!s) return;
  const inv = unusedCards(s), used = s.cards.filter(x => x.used);
  const hist = s.history.slice().reverse().slice(0, 40);
  const invRow = (x, isUsed) => {
    const k = CARD_BY_ID[x.key] || {i:'tag', n:x.key, d:''};
    return `<div class="inv ${x.color} ${isUsed ? 'used' : ''}"><span class="em">${cardIcon(k, x.color)}</span>
      <div class="it">${esc(k.n)}<small>${esc(k.d)}</small></div>
      ${isUsed ? `<button class="btn" onclick="toggleUsed('${cid}','${sid}','${x.id}')">Remettre</button>`
        : `<button class="btn" onclick="toggleUsed('${cid}','${sid}','${x.id}')">Utilisée</button><button class="btn" aria-label="Rembourser" onclick="refundCard('${cid}','${sid}','${x.id}')">${ico('undo')}</button>`}</div>`;
  };
  openSheet(`<div class="shead"><div><h2><b>${esc(s.nom)}</b> ${esc(s.prenom)}</h2><small>${esc(c.name)}</small></div>
      <button class="icon" aria-label="Fermer" onclick="closeSheet()">${ico('x')}</button></div>
    <h3 style="margin:10px 0 6px">Îlot</h3><div class="ilots" id="ilot-chips">${ilotChips(cid, sid)}</div>
    <button class="acc" id="tag-acc" aria-expanded="false" onclick="toggleTagsMenu()"><span>Étiquettes</span><span class="asum" id="tag-sum">${tagSummary(s)}</span><span class="ach">${ico('chev')}</span></button>
    <div class="tagchips" id="tag-chips" style="display:none">${tagChips(cid, sid)}</div>
    <button class="acc" id="note-acc" aria-expanded="false" onclick="toggleNotes()"><span>Notes diverses</span><span class="asum" id="note-sum">${noteSummary(s)}</span><span class="ach">${ico('chev')}</span></button>
    <div id="note-body" style="display:none"><textarea class="notearea" id="note-t" rows="5" placeholder="Où le placer, avec qui ne pas le mettre…" oninput="saveNote('${cid}','${sid}',this.value)">${esc(s.notes || '')}</textarea></div>
    <div class="stats"><div><b>${s.xp}</b><small>XP disponibles</small></div><div><b>${s.total}</b><small>XP gagnés au total</small></div></div>
    <div class="trio"><button class="btn mint" onclick="openGain('${cid}','${sid}','student')">＋ XP</button>
      <button class="btn coral" onclick="openRemove('${cid}','${sid}','student')">− XP</button>
      <button class="btn primary" onclick="openBuy('${cid}','${sid}')">Carte</button></div>
    <div class="trio" style="grid-template-columns:1fr 1fr;margin-top:10px"><button class="btn" onclick="doOubli('${cid}','${sid}')">${ico('backpack')} Oubli d'affaires</button>
      <button class="btn" onclick="sheetAbsent('${cid}','${sid}')">${isAbsent(s) ? 'Marquer présent(e)' : 'Marquer absent(e)'}</button></div>
    ${isBlocked(s) ? `<div class="prev">${blockBadge(s)} Gain d'XP bloqué jusqu'à ${blockTime(s)}.<br><button class="btn" style="margin-top:8px" onclick="liftBlock('${cid}','${sid}')">Lever le blocage</button></div>` : ''}
    <h3>Cartes possédées</h3>
    ${inv.length ? inv.map(x => invRow(x, false)).join('') : '<p class="muted">Aucune carte en attente.</p>'}
    ${used.length ? `<h3>Cartes utilisées</h3>${used.map(x => invRow(x, true)).join('')}` : ''}
    <h3>Historique</h3>
    ${hist.length ? hist.map(h => `<div class="hist"><span class="hd">${fmt(h.t)}</span><span>${esc(h.label)}</span>
      <b class="${h.delta > 0 ? 'pos' : h.delta < 0 ? 'neg' : ''}">${h.delta ? (h.delta > 0 ? '+' : '') + h.delta : ''}</b></div>`).join('') : '<p class="muted">Rien pour le moment.</p>'}
    <div class="trio" style="margin-top:22px"><button class="btn" onclick="openStudentForm('${cid}','${sid}')">Modifier</button>
      <button class="btn" onclick="openFix('${cid}','${sid}')">Corriger XP</button>
      <button class="btn danger-o" onclick="delStudent('${cid}','${sid}')">Supprimer</button></div>`);
}
function toggleUsed(cid, sid, cardId) {
  const c = getClass(cid), s = getStudent(c, sid), x = s.cards.find(y => y.id === cardId), k = CARD_BY_ID[x.key];
  x.used = !x.used;
  logH(s, (x.used ? 'Carte utilisée : ' : 'Carte remise : ') + (k ? k.n : x.key), 0, 'use');
  save(); render(); openStudent(cid, sid);
}
async function refundCard(cid, sid, cardId) {
  const c = getClass(cid), s = getStudent(c, sid), x = s.cards.find(y => y.id === cardId), k = CARD_BY_ID[x.key];
  const ok = await confirmDialog('Rembourser la carte ?', `${x.price} XP sont rendus à ${s.prenom || s.nom}${x.replaced && x.replaced.length ? ' et la carte remplacée lui est rendue' : ''}. Son total d'XP gagnés ne change pas.`, 'Rembourser');
  if (!ok) return;
  s.xp += x.price; s.cards = s.cards.filter(y => y.id !== cardId);
  if (x.replaced && x.replaced.length) s.cards.push(...x.replaced);
  logH(s, 'Carte remboursée : ' + (k ? k.n : x.key), x.price, 'refund');
  save(); render(); openStudent(cid, sid);
}

/* ============ Ajouter des XP ============ */
function openGain(cid, sid, from) {
  const c = getClass(cid), s = getStudent(c, sid);
  if (isBlocked(s)) {
    openSheet(`${backBtn(cid, sid, from)}<h2>Gain d'XP bloqué</h2><p class="muted"><b>${esc(s.nom)}</b> ${esc(s.prenom)}</p>
      <div class="prev">${blockBadge(s)} Oubli d'affaires : pas de gain d'XP jusqu'à ${blockTime(s)}.</div>
      <button class="btn wide" onclick="liftBlock('${cid}','${sid}')">Lever le blocage</button>`);
    return;
  }
  const conds = state.conditions.slice().sort((a, b) => b.xp - a.xp);
  openSheet(`${backBtn(cid, sid, from)}<h2>Ajouter des XP</h2><p class="muted"><b>${esc(s.nom)}</b> ${esc(s.prenom)}, ${s.xp} XP</p>
    <h3>Conditions</h3>
    ${conds.length ? `<div class="cgrid">${conds.map(cd => {
      const used = s.uses[cd.id] || 0, hit = cd.limit > 0 && used >= cd.limit;
      const info = cd.limit > 0 ? `<small class="${hit ? 'hit' : ''}">${used}/${cd.limit} ce chapitre${hit ? ', limite atteinte' : ''}</small>` : '';
      const shade = ['#E3EEE7', '#D6E6DC', '#C8DED0', '#B9D5C4', '#A9CBB7'][Math.min(4, Math.max(0, cd.xp - 2))];
      return `<button class="ctile ${hit ? 'limit' : ''}" style="--tc:${shade}" onclick="applyGain('${cid}','${sid}','${cd.id}')"><span class="cp">+${cd.xp}</span><span class="ctl">${esc(cd.name)}</span>${info}</button>`;
    }).join('')}</div>` : '<p class="muted">Aucune condition. Ajoutes-en dans les réglages.</p>'}
    <h3>Autre montant</h3>
    <div class="two"><input type="number" inputmode="numeric" id="g-n" min="1" placeholder="XP"><input type="text" id="g-m" placeholder="Motif (facultatif)"></div>
    <button class="btn mint wide" onclick="freeGain('${cid}','${sid}')">Ajouter</button>`);
}
async function applyGain(cid, sid, condId) {
  const c = getClass(cid), s = getStudent(c, sid), cd = state.conditions.find(x => x.id === condId);
  if (isBlocked(s)) { buzz([50, 50, 50]); toast(`Gain bloqué jusqu'à ${blockTime(s)}`); return; }
  const used = s.uses[cd.id] || 0;
  if (cd.limit > 0 && used >= cd.limit) {
    const ok = await confirmDialog('Limite atteinte', `${s.prenom || s.nom} a déjà obtenu « ${cd.name} » ${used} fois ce chapitre (maximum ${cd.limit}). Ajouter quand même ?`, 'Ajouter quand même');
    if (!ok) return;
  }
  const u = snapUndo([s]);
  s.xp += cd.xp; s.total += cd.xp; s.uses[cd.id] = used + 1;
  logH(s, cd.name, cd.xp, 'gain'); buzz(30);
  done(`+${cd.xp} XP pour ${s.prenom || s.nom}`, u);
  startQuickFor(cid, cd.id);
}
function freeGain(cid, sid) {
  const n = parseInt($('g-n').value, 10);
  if (!n || n < 1) { toast('Entre un nombre d\'XP'); return; }
  const c = getClass(cid), s = getStudent(c, sid), m = $('g-m').value.trim();
  if (isBlocked(s)) { buzz([50, 50, 50]); toast(`Gain bloqué jusqu'à ${blockTime(s)}`); return; }
  const u = snapUndo([s]);
  s.xp += n; s.total += n; logH(s, m || 'Ajout manuel', n, 'gain'); buzz(30);
  done(`+${n} XP pour ${s.prenom || s.nom}`, u);
}

/* ============ Retirer des XP ============ */
function openRemove(cid, sid, from) {
  const c = getClass(cid), s = getStudent(c, sid);
  openSheet(`${backBtn(cid, sid, from)}<h2>Retirer des XP</h2><p class="muted"><b>${esc(s.nom)}</b> ${esc(s.prenom)}, ${s.xp} XP</p>
    <button class="btn wide" style="margin:12px 0 4px" onclick="doOubli('${cid}','${sid}')">${ico('backpack')} Oubli d'affaires : gain d'XP bloqué 1 h</button>
    <div class="quick">${[1, 2, 3, 5, 10].map(n => `<button class="chip" onclick="document.getElementById('r-n').value=${n}">${n}</button>`).join('')}</div>
    <label>Nombre d'XP à retirer</label><input type="number" inputmode="numeric" id="r-n" min="1" placeholder="Ex. 2">
    <label>Motif (facultatif)</label><input type="text" id="r-m" placeholder="Ex. Bavardages">
    <p class="muted" style="margin-top:10px;font-size:14px">Un retrait baisse aussi le total d'XP gagnés utilisé pour le podium.</p>
    <button class="btn coral wide" onclick="doRemove('${cid}','${sid}')">Retirer</button>`);
}
function doRemove(cid, sid) {
  const n = parseInt($('r-n').value, 10);
  if (!n || n < 1) { toast("Entre un nombre d'XP"); return; }
  const c = getClass(cid), s = getStudent(c, sid), m = $('r-m').value.trim();
  const u = snapUndo([s]);
  const real = Math.min(n, s.xp);
  s.xp -= real; s.total = Math.max(0, s.total - n);
  logH(s, m || 'Retrait manuel', -real, 'loss'); buzz([50, 50, 50]);
  done(`−${real} XP pour ${s.prenom || s.nom}`, u);
}
function openFix(cid, sid) {
  const c = getClass(cid), s = getStudent(c, sid);
  openSheet(`<h2>Corriger le solde</h2><p class="muted">Pour réparer une erreur de saisie. Le total d'XP gagnés est ajusté de la même différence.</p>
    <label>Nouveau solde d'XP</label><input type="number" inputmode="numeric" id="x-n" min="0" value="${s.xp}">
    <button class="btn primary wide" onclick="doFix('${cid}','${sid}')">Enregistrer</button>`);
}
function doFix(cid, sid) {
  const n = parseInt($('x-n').value, 10);
  if (isNaN(n) || n < 0) { toast('Entre un nombre valide'); return; }
  const c = getClass(cid), s = getStudent(c, sid), d = n - s.xp;
  s.xp = n; s.total = Math.max(0, s.total + d);
  logH(s, 'Correction du solde', d, 'fix');
  done('Solde corrigé');
}

/* ============ Historique de la classe ============ */
let histo = {cid:'', cat:'all', sort:'date', q:'', limit:80};
const HCATS = [['all', 'Tout'], ['gain', 'Gagnés'], ['loss', 'Perdus'], ['oubli', 'Oublis'], ['abs', 'Absences'], ['cartes', 'Cartes'], ['archives', 'Archives des chapitres']];
const HLABEL = {gain:'Gain', loss:'Retrait', oubli:'Oubli', abs:'Absence', cartes:'Carte'};
function histCat(h) {
  if (h.kind === 'absent') return 'abs';
  if (h.kind === 'block') return 'oubli';
  if (h.kind === 'buy' || h.kind === 'use' || h.kind === 'refund') return 'cartes';
  if (h.kind === 'gain') return 'gain';
  if (h.kind === 'loss') return 'loss';
  return h.delta > 0 ? 'gain' : h.delta < 0 ? 'loss' : 'cartes';
}
function openHisto(cid) {
  histo = {cid, cat:'all', sort:'date', q:'', limit:80};
  const c = getClass(cid);
  openSheet(`<div class="shead"><div><h2>Historique</h2><small>${esc(c.name)}</small></div>
      <button class="icon" aria-label="Fermer" onclick="closeSheet()">${ico('x')}</button></div>
    <div class="sorts" id="histo-sort" style="margin-top:10px"></div>
    <div class="sorts" id="histo-chips"></div>
    <input class="search" type="search" placeholder="Filtrer par élève" style="margin:4px 0 8px" oninput="histo.q=this.value;histo.limit=80;renderHisto()">
    <div id="histo-body"></div>`);
  renderHisto();
}
function histoSet(k, v) { histo[k] = v; histo.limit = 80; renderHisto(); }
function renderHisto() {
  const c = getClass(histo.cid);
  if (!c || !$('histo-body')) return;
  const q = norm(histo.q);
  const all = [];
  c.students.forEach(s => s.history.forEach(h => { if (!q || norm(nameOf(s)).includes(q)) all.push({s, h, cat:histCat(h)}); }));
  const count = {all:all.length, gain:0, loss:0, oubli:0, abs:0, cartes:0, archives:(c.chapitres_archives || []).length};
  all.forEach(r => count[r.cat]++);
  $('histo-sort').innerHTML = [['date', 'Par date'], ['student', 'Par élève']]
    .map(([k, l]) => `<button class="chip ${histo.sort === k ? 'on' : ''}" onclick="histoSet('sort','${k}')">${l}</button>`).join('');
  $('histo-chips').innerHTML = HCATS.map(([k, l]) => `<button class="chip ${histo.cat === k ? 'on' : ''}" onclick="histoSet('cat','${k}')">${l} (${count[k]})</button>`).join('');
  if (histo.cat === 'archives') { $('histo-body').innerHTML = archivesHTML(c); return; }
  const rows = all.filter(r => histo.cat === 'all' || r.cat === histo.cat);
  const tcmp = (a, b) => a.h.t < b.h.t ? 1 : a.h.t > b.h.t ? -1 : 0;
  if (histo.sort === 'student') rows.sort((a, b) => alphaCmp(a.s, b.s) || tcmp(a, b)); else rows.sort(tcmp);
  const sum = list => list.reduce((a, r) => a + r.h.delta, 0);
  const gained = sum(rows.filter(r => r.cat === 'gain')), lost = sum(rows.filter(r => r.cat === 'loss'));
  if (!rows.length) { $('histo-body').innerHTML = '<div class="empty" style="padding:30px 10px">Aucun événement pour ce filtre.</div>'; return; }
  const dayOf = t => new Date(t).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  const timeOf = t => new Date(t).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  const shortDate = t => new Date(t).toLocaleDateString('fr-FR', {day:'numeric', month:'short'}) + ' ' + timeOf(t);
  const delta = h => h.delta ? `<b class="hd ${h.delta > 0 ? 'pos' : 'neg'}">${h.delta > 0 ? '+' : '−'}${Math.abs(h.delta)}</b>` : '<span class="hd"></span>';
  const shown = rows.slice(0, histo.limit);
  let html = `<div class="prev">${rows.length} événement${pl(rows.length, '', 's')}${gained ? `, +${gained} XP gagnés` : ''}${lost ? `, ${lost} XP perdus` : ''}</div>`, last = '';
  shown.forEach(r => {
    const grp = histo.sort === 'student' ? r.s.id : dayOf(r.h.t);
    if (grp !== last) {
      last = grp;
      if (histo.sort === 'student') {
        const mine = rows.filter(x => x.s === r.s);
        const g = sum(mine.filter(x => x.cat === 'gain')), l = sum(mine.filter(x => x.cat === 'loss'));
        html += `<div class="hhead"><span><b>${esc(r.s.nom)}</b> ${esc(r.s.prenom)}</span><span>${g ? '+' + g : ''}${g && l ? ' ' : ''}${l ? l : ''}</span></div>`;
      } else html += `<div class="hhead"><span>${esc(dayOf(r.h.t))}</span></div>`;
    }
    html += histo.sort === 'student'
      ? `<div class="hrow"><span class="hb ${r.cat}">${HLABEL[r.cat]}</span><div class="ht">${esc(r.h.label)}<small>${shortDate(r.h.t)}</small></div>${delta(r.h)}</div>`
      : `<div class="hrow"><span class="hb ${r.cat}">${HLABEL[r.cat]}</span><div class="ht"><b>${esc(r.s.nom)}</b> ${esc(r.s.prenom)}<small>${esc(r.h.label)}, ${timeOf(r.h.t)}</small></div>${delta(r.h)}</div>`;
  });
  if (rows.length > shown.length) html += `<button class="btn wide" onclick="histo.limit+=80;renderHisto()">Afficher plus (${rows.length - shown.length} restants)</button>`;
  $('histo-body').innerHTML = html;
}

/* ============ Professeur principal et notes ============ */
const profField = c => `<span class="profw"><input class="prof" type="text" maxlength="40" placeholder="Prof. principal" aria-label="Professeur principal" value="${esc(c.prof || '')}" onchange="setProf('${c.id}', this.value)" onkeydown="if(event.key==='Enter')this.blur()"></span>`;
function setProf(cid, v) { const c = getClass(cid); if (c) { c.prof = v.trim(); save(); } }
const noteSummary = s => (s.notes && s.notes.trim()) ? `<span class="nt">${esc(s.notes.trim().replace(/\s+/g, ' ').slice(0, 40))}</span>` : '<span class="none">Aucune</span>';
function toggleNotes() {
  const body = $('note-body'), acc = $('note-acc');
  if (!body || !acc) return;
  const open = body.style.display === 'none';
  body.style.display = open ? 'block' : 'none';
  acc.classList.toggle('open', open);
  acc.setAttribute('aria-expanded', open);
  if (open) { const t = $('note-t'); if (t) t.focus(); }
}
let noteTimer = null;
function saveNote(cid, sid, v) {
  const s = getStudent(getClass(cid), sid);
  if (!s) return;
  s.notes = v;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { save(); const n = $('note-sum'); if (n) n.innerHTML = noteSummary(s); if (view.name === 'class') renderList(); }, 500);
}

/* ============ Îlots (plan de classe) ============ */
const ILOTS = ['A', 'B', 'C', 'D', 'E', 'F'];

const ilotStyle = l => `--ib:${ILOT_COLORS[l][0]};--ic:${ILOT_COLORS[l][1]}`;
const ilotRank = s => { const i = ILOTS.indexOf(s.ilot); return i < 0 ? ILOTS.length : i; };
function ilotBadge(c, s, fixed) {
  const has = s.ilot && ILOT_COLORS[s.ilot];
  const cls = has ? 'ilot' : 'ilot none', st = has ? ` style="${ilotStyle(s.ilot)}"` : '', txt = has ? s.ilot : '·';
  if (fixed) return `<span class="${cls}"${st}>${txt}</span>`;

/* ============ Acheter une carte ============ */
function openBuy(cid, sid) {
  const c = getClass(cid), s = getStudent(c, sid);
  const group = col => {
    const price = PRICE[col];
    const head = col === 'special' ? `${COLOR_LABEL[col]}, XP à saisir` : `${COLOR_LABEL[col]}, ${price} XP`;
    return `<div class="${col}"><span class="buyhead ${col}">${head}</span>` +
      CARDS.filter(k => k.c === col).map(k => {
        const ci = col === 'special' ? null : costFor(s, k, c.chapter);
        const dis = ci && s.xp < ci.price;
        const act = col === 'special' ? `openSpecial('${cid}','${sid}','${k.id}')` : `buyCard('${cid}','${sid}','${k.id}')`;
        const note = ci && ci.from ? `<small><b>${ci.price} XP</b> au lieu de ${ci.base} (remplace ${ci.lowers.map(x => esc((CARD_BY_ID[x.key] || {}).n || x.key)).join(' et ')})</small>` : '';
        return `<div class="inv ${col}"><span class="em">${cardIcon(k)}</span><div class="it">${esc(k.n)}<small>${esc(k.d)}</small>${note}</div>
          <button class="btn" ${dis ? 'disabled' : ''} onclick="${act}">${ci ? ci.price + ' XP' : 'Choisir'}</button></div>`;
      }).join('') + '</div>';
  };
  openSheet(`<h2>Acheter une carte</h2><p class="muted"><b>${esc(s.nom)}</b> ${esc(s.prenom)}, ${s.xp} XP disponibles</p>
    ${['green', 'blue', 'violet', 'special'].map(group).join('')}`);
}
function giveCard(s, k, price, lowers, chapter) {
  s.xp -= price;
  const replaced = lowers || [];
  if (replaced.length) s.cards = s.cards.filter(x => !replaced.includes(x));
  s.cards.push({id:uid(), key:k.id, color:k.c, used:false, price, replaced, chapter, t:new Date().toISOString()});
  const names = replaced.map(x => (CARD_BY_ID[x.key] || {}).n || x.key).join(' et ');
  logH(s, 'Carte achetée : ' + k.n + (replaced.length ? ` (tarif réduit, remplace ${names})` : ''), -price, 'buy');
}
function buyCard(cid, sid, kid) {
  const c = getClass(cid), s = getStudent(c, sid), k = CARD_BY_ID[kid], ci = costFor(s, k, c.chapter), price = ci.price;
  if (s.xp < price) { buzz([50, 50, 50]); toast('XP insuffisants'); return; }
  const u = snapUndo([s]);
  giveCard(s, k, price, ci.lowers, c.chapter);
  done(`${k.n} pour ${s.prenom || s.nom} (−${price} XP)`, u);
}
function openSpecial(cid, sid, kid) {
  const c = getClass(cid), s = getStudent(c, sid), k = CARD_BY_ID[kid];
  openSheet(`<h2>${cardIcon(k)} ${esc(k.n)}</h2><p class="muted">${esc(k.d)}</p>
    <label>XP à déduire (0 si aucun)</label><input type="number" inputmode="numeric" id="sp-n" min="0" value="${k.def || 0}">
    <p class="muted" style="margin-top:8px;font-size:14px">${esc(s.prenom || s.nom)} a ${s.xp} XP disponibles.</p>
    <button class="btn primary wide" onclick="buySpecial('${cid}','${sid}','${kid}')">Donner la carte</button>`);
}
function buySpecial(cid, sid, kid) {
  const n = parseInt($('sp-n').value, 10);
  if (isNaN(n) || n < 0) { toast('Entre un nombre valide'); return; }
  const c = getClass(cid), s = getStudent(c, sid), k = CARD_BY_ID[kid];
  if (n > s.xp) { toast('XP insuffisants'); return; }
  const u = snapUndo([s]);
  giveCard(s, k, n, [], c.chapter);
  done(`${k.n} pour ${s.prenom || s.nom}`, u);
}

function startAppel() { view.appel = true; view.plan = false; view.label = null; render(); }

function toggleAbsent(cid, sid) {
  const c = getClass(cid), s = getStudent(c, sid), day = ymd();
  if (isAbsent(s)) {
    s.absentDate = null;
    for (let i = s.history.length - 1; i >= 0; i--) {
      if (s.history[i].kind === 'absent' && s.history[i].day === day) { s.history.splice(i, 1); break; }
    }
  } else {
    s.absentDate = day;
    s.history.push({t:new Date().toISOString(), label:'Absent(e)', delta:0, kind:'absent', day});
  }
  save(); renderList();
  const n = c.students.filter(isAbsent).length, f = $('appel-fab');
  if (f) f.textContent = `Terminer l'appel (${n} absent${n > 1 ? 's' : ''})`;
}
function sheetAbsent(cid, sid) { toggleAbsent(cid, sid); render(); openStudent(cid, sid); }

function setCxMode(m) { cx.mode = m; updCx(); }
function cxTargets() {
  const c = getClass(cx.cid);
  const absent = c.students.filter(isAbsent), present = c.students.filter(s => !isAbsent(s));
  const blocked = cx.mode === 'add' ? present.filter(isBlocked) : [];
  return {c, absent, blocked, targets:present.filter(s => !blocked.includes(s))};
}
function shortNames(a) {
  return a.slice(0, 6).map(s => `${esc(s.nom)} ${esc(s.prenom.charAt(0))}.`).join(', ') + (a.length > 6 ? ` et ${a.length - 6} autres` : '');
}
function updCx() {
  const t = cxTargets(), add = cx.mode === 'add';
  $('cx-info').innerHTML = `<div><b>${t.targets.length}</b> élève${t.targets.length > 1 ? 's' : ''} concerné${t.targets.length > 1 ? 's' : ''}</div>`
    + (t.absent.length ? `<div>Absents : ${shortNames(t.absent)}</div>` : '')
    + (t.blocked.length ? `<div>${ico('backpack')} Gain bloqué : ${shortNames(t.blocked)}</div>` : '');
  $('cx-add').classList.toggle('on', add); $('cx-rem').classList.toggle('on', !add);
  const b = $('cx-go'); b.className = `btn ${add ? 'mint' : 'coral'} wide`; b.textContent = add ? 'Ajouter à la classe' : 'Retirer à la classe';
}
async function applyClassXP() {
  const n = parseInt($('cx-n').value, 10);
  if (!n || n < 1) { toast("Entre un nombre d'XP"); return; }
  const t = cxTargets(), add = cx.mode === 'add';
  if (!t.targets.length) { toast('Aucun élève concerné'); return; }
  const m = $('cx-m').value.trim();
  const extra = (t.absent.length ? `, ${t.absent.length} absent${t.absent.length > 1 ? 's' : ''} exclu${t.absent.length > 1 ? 's' : ''}` : '')
    + (t.blocked.length ? `, ${t.blocked.length} bloqué${t.blocked.length > 1 ? 's' : ''} exclu${t.blocked.length > 1 ? 's' : ''}` : '');
  const ok = await confirmDialog(add ? `Ajouter +${n} XP ?` : `Retirer ${n} XP ?`,
    `${t.targets.length} élève${t.targets.length > 1 ? 's' : ''} concerné${t.targets.length > 1 ? 's' : ''}${extra}.`, add ? 'Ajouter' : 'Retirer', !add);
  if (!ok) return;
  const u = snapUndo(t.targets);
  t.targets.forEach(s => {
    if (add) { s.xp += n; s.total += n; logH(s, m || 'XP pour toute la classe', n, 'gain'); }
    else { const real = Math.min(n, s.xp); s.xp -= real; s.total = Math.max(0, s.total - n); logH(s, m || 'Retrait pour toute la classe', -real, 'loss'); }
  });
  buzz(add ? 30 : [50, 50, 50]);
  done(`${add ? '+' : '−'}${n} XP pour ${t.targets.length} élève${t.targets.length > 1 ? 's' : ''}`, u);
}

async function doOubli(cid, sid) {
  const c = getClass(cid), s = getStudent(c, sid);
  if (isBlocked(s)) { toast(`Déjà bloqué jusqu'à ${blockTime(s)}`); return; }
  const ok = await confirmDialog("Oubli d'affaires ?", `${s.prenom || s.nom} ne peut plus gagner d'XP pendant ${fmtDur(blockMinutes())}. Ses ${s.xp} XP actuels sont conservés.`, `Bloquer ${fmtDur(blockMinutes())}`, true);
  if (!ok) return;
  const bm = blockMinutes();
  s.blockedUntil = Date.now() + bm * 60000; s.blockDur = bm * 60000;
  logH(s, `Oubli d'affaires : gain d'XP bloqué ${fmtDur(bm)}`, 0, 'block');
  done(`${s.prenom || s.nom} : gain bloqué jusqu'à ${blockTime(s)}`);
}
function liftBlock(cid, sid) {
  const c = getClass(cid), s = getStudent(c, sid);
  s.blockedUntil = null;
  logH(s, 'Blocage levé', 0, 'block');
  done('Blocage levé');
}
/* Rafraîchit la liste pour que les blocages d'une heure disparaissent d'eux-mêmes */
/* Minuteur global : toutes les 10 s, ou chaque seconde si un oubli d'affaires est affiché */
function tickBlocks() {
  let expired = false;
  document.querySelectorAll('[data-until]').forEach(el => {
    const until = +el.dataset.until, left = until - Date.now();
    if (left <= 0) { expired = true; return; }
    const arc = el.querySelector('.rp'); if (arc) arc.setAttribute('stroke-dashoffset', ringArc(left, +el.dataset.dur));
    const t = el.querySelector('.btxt'); if (t) t.textContent = fmtLeft(until);
  });
  if (expired && view.name === 'class') render();
  scheduleBlockTick();
}
function scheduleBlockTick() {
  const n = document.querySelectorAll('[data-until]').length;
  setTimeout(tickBlocks, n ? 1000 : 10000);
}
scheduleBlockTick();

/* ============ Classe d'essai (données fictives) ============ */
function seedRand(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeDemoClass() {
  const rnd = seedRand(20261009), pick = a => a[Math.floor(rnd() * a.length)];
  const noms = ['ADAM', 'BAILLY', 'BERTRAND', 'BOYER', 'CHEVALIER', 'COLIN', 'DUMAS', 'FAURE', 'FOURNIER', 'GAUTIER', 'GIRARD', 'GUILLOT', 'HENRY', 'JACQUET', 'LAMBERT',
    'LEROY', 'MARCHAND', 'MASSON', 'NICOLAS', 'PERRIN', 'PICARD', 'RENARD', 'ROUSSEAU', 'SIMON', 'TESSIER', 'THOMAS', 'VIDAL', 'VINCENT', 'WEBER', 'ZIMMER'];
  const prenoms = ['Léa', 'Hugo', 'Zoé', 'Lucas', 'Chloé', 'Nathan', 'Manon', 'Ethan', 'Inès', 'Jules', 'Camille', 'Louis', 'Jade', 'Gabriel', 'Emma', 'Tom', 'Sarah', 'Noah', 'Lina',
    'Maël', 'Alice', 'Raphaël', 'Clara', 'Théo', 'Anaïs', 'Adam', 'Louise', 'Enzo', 'Mila', 'Axel'];
  for (let i = prenoms.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [prenoms[i], prenoms[j]] = [prenoms[j], prenoms[i]]; }
  const days = ['2026-09-03', '2026-09-07', '2026-09-10', '2026-09-14', '2026-09-17', '2026-09-21', '2026-09-24', '2026-09-28', '2026-10-01', '2026-10-05', '2026-10-08'];
  const chapterOf = i => i < 4 ? 1 : i < 8 ? 2 : 3;
  const ts = (i, min) => new Date(`${days[i]}T10:${String(5 + Math.min(min, 40)).padStart(2, '0')}:00`).toISOString();
  const students = noms.map((n, i) => newStudent(n, prenoms[i]));
  const dil = students.map(() => 0.6 + rnd() * 0.9);
  const oubli = {5: 7, 17: 9}, punis = new Set([3, 8, 12, 21, 25]);
  for (let i = 0; i < days.length; i++) {
    const ch = chapterOf(i);
    if (i === 4 || i === 8) students.forEach(s => {
      s.uses = {};
      s.cards.forEach(x => {
        if (x.used) return;
        x.used = true;
        s.history.push({t:new Date(days[i] + 'T08:00:00').toISOString(), label:'Carte utilisée (fin de chapitre) : ' + CARD_BY_ID[x.key].n, delta:0, kind:'use'});
      });
    });
    students.forEach((s, k) => {
      let m = 0;
      const add = (label, delta, kind, extra) => { s.history.push(Object.assign({t:ts(i, m), label, delta, kind}, extra || {})); m += 2; };
      if (rnd() < 0.06) { add('Absent(e)', 0, 'absent', {day:days[i]}); return; }
      const blocked = oubli[k] === i;
      if (blocked) add("Oubli d'affaires : gain d'XP bloqué 1 h", 0, 'block');
      else state.conditions.forEach(cd => {
        const used = s.uses[cd.id] || 0;
        if (cd.limit > 0 && used >= cd.limit) return;
        const p = (cd.limit > 0 ? 0.13 : cd.xp <= 2 ? 0.55 : cd.xp <= 3 ? 0.4 : 0.3) * dil[k];
        if (rnd() < p) { s.xp += cd.xp; s.total += cd.xp; s.uses[cd.id] = used + 1; add(cd.name, cd.xp, 'gain'); }
      });
      if (punis.has(k) && rnd() < 0.25) {

function pdfEsc(v) {

}
function makePdf(pages) {
  const objs = [null, null, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
  const kids = [];
  pages.forEach(ops => {
    const content = ops.join('\n');
    objs.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    const cIdx = objs.length;
    objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cIdx} 0 R >>`);
    kids.push(`${objs.length} 0 R`);
  });
  objs[0] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[1] = `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pages.length} >>`;
  let out = '%PDF-1.4\n';
  const offs = objs.map((o, i) => { const at = out.length; out += `${i + 1} 0 obj\n${o}\nendobj\n`; return at; });
  const xref = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xff;
  return bytes;

async function exportData() {
  const name = `jokers-xp-${new Date().toISOString().slice(0, 10)}.json`;
  const json = JSON.stringify(state, (k, v) => k === 'sync' ? undefined : v, 1);
  /* Page publiée : l'enregistrement d'un fichier passe par la capacité « downloads » */
  let dl = null;
  try { dl = window.claude ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({filename:name, data:json}); }
    catch (e) { if (e && e.code === 'declined') return; toast("L'export n'est pas disponible ici"); return; }
    state.lastExport = Date.now(); save(); toast('Sauvegarde exportée'); openSettingsPage('backup');
    return;
  }
  const file = new File([json], name, {type:'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:'Sauvegarde Jokers XP'});
    else downloadFile(file);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    downloadFile(file);
  }
  state.lastExport = Date.now(); save(); toast('Sauvegarde exportée'); openSettingsPage('backup');
}
function importData(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.classes)) throw new Error('format');
      const nb = d.classes.length;
      const ok = await confirmDialog('Remplacer les données ?', `Cette sauvegarde contient ${nb} classe${nb > 1 ? 's' : ''}. Tes données actuelles seront remplacées.`, 'Remplacer', true);
      if (!ok) return;
      if (!d.conditions) d.conditions = clone(DEFAULT_CONDITIONS);
      const keepSync = state.sync;
      state = d; state.sync = keepSync; if (keepSync && keepSync.on) keepSync.dirty = true;
      view = {name:'home'}; ensureTones(); if (!state.homeSort) state.homeSort = 'level';
      done('Sauvegarde importée');
    } catch (e) { toast('Ce fichier n\'est pas une sauvegarde valide'); }
  };
  r.readAsText(f);
  input.value = '';
}

/* ============ Sauvegardes automatiques (à chaque sortie de la page) ============ */
const SNAP_DB = 'jokers_xp_backup', SNAP_STORE = 'snaps', SNAP_KEEP = 7;
let lastSnapJson = null;
const snapJson = () => JSON.stringify(state, (k, v) => k === 'sync' ? undefined : v);
function snapDB() {
  return new Promise((res, rej) => {
    try {
      const rq = indexedDB.open(SNAP_DB, 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore(SNAP_STORE, {keyPath:'id', autoIncrement:true});
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    } catch (e) { rej(e); }
  });
}
async function snapList() {
  const db = await snapDB();
  return new Promise((res, rej) => {
    const rq = db.transaction(SNAP_STORE).objectStore(SNAP_STORE).getAll();
    rq.onsuccess = () => res(rq.result.sort((a, b) => b.t - a.t));
    rq.onerror = () => rej(rq.error);
  });
}
function snapNow() {
  if (!state.classes.length) return;
  const json = snapJson();
  if (json === lastSnapJson) return;
  lastSnapJson = json;
  snapDB().then(db => {
    const tx = db.transaction(SNAP_STORE, 'readwrite'), st = tx.objectStore(SNAP_STORE);
    st.add({t:Date.now(), json, nc:state.classes.length, ns:state.classes.reduce((a, c) => a + c.students.length, 0)});
    const kr = st.getAllKeys();
    kr.onsuccess = () => kr.result.slice(0, Math.max(0, kr.result.length - SNAP_KEEP)).forEach(k => st.delete(k));
  }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') snapNow(); });
window.addEventListener('pagehide', snapNow);
async function renderSnaps() {
  const el = $('snap-list');
  if (!el) return;
  try {
    const l = await snapList();
    el.innerHTML = l.length
      ? l.map(x => `<div class="snap"><span>${fmt(x.t)}<small>${x.nc} classe${pl(x.nc, '', 's')}, ${x.ns} élève${pl(x.ns, '', 's')}</small></span><button class="btn" onclick="restoreSnap(${x.id})">Restaurer</button></div>`).join('')
      : '<p class="muted">Aucune pour le moment : la première est créée quand tu quittes la page.</p>';
  } catch (e) { el.innerHTML = '<p class="muted">Indisponible sur ce navigateur.</p>'; }
}
async function applySnap(rec) {
  lastSnapJson = null; snapNow();            /* garde l'état actuel avant de restaurer */
  const keepSync = state.sync;
  state = JSON.parse(rec.json); state.sync = keepSync; if (keepSync && keepSync.on) keepSync.dirty = true;
  if (!state.conditions) state.conditions = clone(DEFAULT_CONDITIONS);
  if (!state.homeSort) state.homeSort = 'level';
  view = {name:'home'}; ensureTones();
  lastSnapJson = snapJson();
  done('Sauvegarde restaurée');
}
async function restoreSnap(id) {
  const rec = (await snapList()).find(x => x.id === id);
  if (!rec) return;
  const ok = await confirmDialog('Restaurer cette sauvegarde ?', `Les données actuelles seront remplacées par celles du ${fmt(rec.t)} (${rec.nc} classe${pl(rec.nc, '', 's')}, ${rec.ns} élève${pl(rec.ns, '', 's')}). L'état actuel est conservé dans la liste.`, 'Restaurer', true);
  if (ok) applySnap(rec);
}

/* ============ Synchronisation avec le compte (option) ============ */
/* Les données sont rangées dans l'espace privé du viewer : data/users/<id>/ (invisible pour les autres, même le propriétaire). */
let dbCtx = null, pushing = false, pushAgain = false, pushTimer = null, retryTimer = null, syncErr = null, syncMsg = '', conflictRemote = null, remoteIds = null;
const docCache = new Map();
const syncOn = () => !!(state.sync && state.sync.on);
const FATAL = ['quota_exceeded', 'revoked', 'not_granted', 'invalid_argument', 'capability_disabled', 'capability_removed'];
async function getDB() {
  if (dbCtx) return dbCtx;
  try {
    if (!window.claude || !window.claude.use) return null;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return null;
    const uid = await user.id();
    if (!uid) return null;
    dbCtx = {db, uid, col:db.collection('data/users/' + uid)};
    return dbCtx;
  } catch (e) { return null; }
}
async function dbGranted() {
  try { const p = window.claude && await window.claude.use('permissions'); return !!p && (await p.state('db')) === 'granted'; } catch (e) { return false; }
}
function errText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return "l'espace du compte est plein";
  if (c === 'resource_exhausted') return 'trop de requêtes, nouvel essai dans une minute';
  if (c === 'revoked' || c === 'not_granted') return 'accès refusé par le compte';
  if (c === 'invalid_argument') return "données refusées par le serveur";
  return 'synchronisation impossible pour le moment';
}
function syncBadgeText() { if (!syncOn()) return ''; const t = pushing ? ['cloud', '…'] : syncErr ? ['alert', ''] : state.sync.dirty ? ['cloud', ' en attente'] : ['cloud', ' à jour']; return ` <span class="sb">${ico(t[0])}${t[1]}</span>`; }
function syncStatusText() {
  if (pushing) return syncMsg || 'Synchronisation en cours…';
  if (syncErr) return 'Erreur : ' + syncErr + '.';
  if (state.sync && state.sync.dirty) return "Modifications en attente d'envoi.";
  return state.sync && state.sync.lastSync ? 'À jour : dernière synchronisation le ' + fmt(state.sync.lastSync) + '.' : 'À jour.';
}
function setSyncStatus() {
  const b = $('sync-badge'); if (b) b.innerHTML = syncBadgeText();
  const s = $('sync-status'); if (s) s.textContent = syncStatusText();
}
async function withRetry(fn) {
  let d = 800;
  for (let i = 0; i < 4; i++) {
    try { return await fn(); }
    catch (e) {
      const c = e && e.code;
      if ((c === 'resource_exhausted' || c === 'unavailable') && i < 3) { await new Promise(r => setTimeout(r, d + Math.random() * 400)); d *= 2; continue; }
      throw e;
    }
  }
}
/* Un document par paquet d'élèves (≈150 Ko max) : une classe avec un an d'historique dépasse la limite d'un seul document (256 Ko) */
function buildDocs() {
  const docs = new Map();
  state.classes.forEach(c => {
    const sts = c.students.slice().sort((a, b) => a.id < b.id ? -1 : 1);
    let cur = [], size = 0, n = 0;
    const flush = () => { if (cur.length) { docs.set(`c-${c.id}-${n}`, {classId:c.id, idx:n, students:cur}); n++; cur = []; size = 0; } };
    sts.forEach(st => {
      let s = st;
      const sz = JSON.stringify(s).length; if (cur.length && size + sz > 150000) flush(); cur.push(s); size += sz;
    });
    flush();
  });
  return docs;
}
function buildMeta(rev) {
  return {v:1, rev, updatedAt:Date.now(), conditions:state.conditions, tagDefs:state.tagDefs, homeSort:state.homeSort || 'level',
    ns:state.classes.reduce((a, c) => a + c.students.length, 0),
    classes:state.classes.map(c => ({id:c.id, name:c.name, level:c.level, tone:c.tone, chapter:c.chapter, prof:c.prof || ''}))};
}
async function listRemoteIds(c) {
  const snap = await c.col.limit(1000).get();
  return new Set(snap.docs.map(d => d.id));
}
function schedulePush() {
  if (!syncOn()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushNow(), 2500);
}
async function pushNow(force) {
  if (!syncOn()) return;
  if (pushing) { pushAgain = true; return; }
  const c = await getDB();
  if (!c) return;
  pushing = true; syncMsg = 'Synchronisation en cours…'; setSyncStatus();
  const seq = changeSeq;
  try {
    const rm = await c.col.doc('meta').get();
    const remote = rm.exists ? rm.data() : null;
    if (remote && remote.rev !== state.sync.remoteRev && !force) { pushing = false; syncConflict(clone(remote)); setSyncStatus(); return; }
    const docs = buildDocs();
    if (!remoteIds) remoteIds = await listRemoteIds(c);
    const todo = [...docs].filter(([id, data]) => !(remoteIds.has(id) && docCache.get(id) === JSON.stringify(data)));
    let i = 0;
    for (const [id, data] of todo) {
      i++; syncMsg = `Envoi ${i}/${todo.length}…`; setSyncStatus();
      await withRetry(() => c.col.doc(id).set(data));
      docCache.set(id, JSON.stringify(data)); remoteIds.add(id);
    }
    for (const id of [...remoteIds]) {
      if (id === 'meta' || docs.has(id)) continue;
      await withRetry(() => c.col.doc(id).delete());
      remoteIds.delete(id); docCache.delete(id);
    }
    const rev = Math.max(remote ? remote.rev : 0, state.sync.remoteRev || 0) + 1;
    await withRetry(() => c.col.doc('meta').set(buildMeta(rev)));
    remoteIds.add('meta');
    state.sync.remoteRev = rev; state.sync.lastSync = Date.now();
    if (changeSeq === seq) state.sync.dirty = false;
    syncErr = null; saveLocal();
  } catch (e) {
    syncErr = errText(e);
    if (!FATAL.includes(e && e.code)) { clearTimeout(retryTimer); retryTimer = setTimeout(schedulePush, 60000); }
  } finally {
    pushing = false;
    if (pushAgain) { pushAgain = false; schedulePush(); }
    setSyncStatus();
  }
}
async function pullAll(c) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const m1 = await c.col.doc('meta').get();
    if (!m1.exists) return null;
    const meta = clone(m1.data());
    const snap = await c.col.limit(1000).get();
    const m2 = await c.col.doc('meta').get();
    if (m2.exists && m2.data().rev !== meta.rev) continue;      /* un autre appareil écrivait : on relit */
    const chunks = {}, cache = new Map(), ids = new Set(snap.docs.map(d => d.id));
    snap.docs.forEach(d => {
      if (!d.id.startsWith('c-')) return;
      const x = clone(d.data());
      cache.set(d.id, JSON.stringify(x));
      (chunks[x.classId] = chunks[x.classId] || []).push(x);
    });
    const classes = (meta.classes || []).map(k => ({...k, students:(chunks[k.id] || []).sort((a, b) => a.idx - b.idx).flatMap(x => x.students)}));
    return {meta, classes, ids, cache};
  }
  throw {code:'unavailable'};
}
function applyRemote(res) {
  const keep = state.sync;
  const keepTags = {};
  state.classes.forEach(c => c.students.forEach(s => { if ((s.tags && s.tags.length) || s.notes) keepTags[s.id] = {tags:s.tags || [], notes:s.notes || ''}; }));
  state.classes = res.classes;
  state.tagDefs = res.meta.tagDefs || state.tagDefs;
  state.conditions = res.meta.conditions || state.conditions;
  state.homeSort = res.meta.homeSort || 'level';
  state.sync = Object.assign({}, keep, {on:true, remoteRev:res.meta.rev, dirty:false, lastSync:Date.now()});
  state.classes.forEach(c => c.students.forEach(s => { const k = keepTags[s.id]; if (k) { if (s.tags === undefined) s.tags = k.tags; if (s.notes === undefined) s.notes = k.notes; } if (s.tags === undefined) s.tags = []; }));   /* ne jamais perdre les étiquettes locales si le compte n'en contient pas encore */
  docCache.clear(); res.cache.forEach((v, k) => docCache.set(k, v));
  remoteIds = res.ids;
  syncErr = null; view = {name:'home'}; ensureTones(); saveLocal();
}
function syncConflict(remote) {
  conflictRemote = remote;
  const mineS = state.classes.reduce((a, c) => a + c.students.length, 0);
  openSheet(`<h2>Deux versions des données</h2>
    <p class="muted" style="margin-top:6px">Le compte contient ${remote.classes.length} classe${pl(remote.classes.length, '', 's')} et ${remote.ns} élève${pl(remote.ns, '', 's')} (modifiés le ${fmt(remote.updatedAt)}).
    Cet appareil contient ${state.classes.length} classe${pl(state.classes.length, '', 's')} et ${mineS} élève${pl(mineS, '', 's')}. Choisis la version à garder : l'autre sera remplacée.</p>
    <button class="btn primary wide" onclick="syncChoose('remote')">Garder les données du compte</button>
    <button class="btn wide" style="margin-top:10px" onclick="syncChoose('local')">Garder les données de cet appareil</button>
    <button class="btn wide" style="margin-top:10px" onclick="conflictRemote=null;closeSheet()">Décider plus tard</button>`);
}
async function syncChoose(which) {
  const c = await getDB(), remote = conflictRemote;
  if (!c || !remote) return;
  const ok = await confirmDialog(which === 'remote' ? 'Garder les données du compte ?' : 'Garder les données de cet appareil ?',
    which === 'remote' ? 'Les données de cet appareil seront remplacées par celles du compte.' : 'Les données du compte seront remplacées par celles de cet appareil.', 'Confirmer', true);
  if (!ok) return;
  conflictRemote = null;
  try {
    if (which === 'remote') {
      const res = await pullAll(c);
      if (!res) throw {code:'unavailable'};
      applyRemote(res); closeSheet(); render(); toast('Données du compte chargées');
    } else {
      state.sync = Object.assign({}, state.sync, {on:true, remoteRev:remote.rev, dirty:true}); saveLocal();
      closeSheet(); render(); await pushNow(true);
    }
  } catch (e) { syncErr = errText(e); toast(syncErr); }
  renderSyncBox();
}
async function checkRemote(c) {
  try {
    const m = await c.col.doc('meta').get();
    if (!m.exists) { if (state.classes.length) { state.sync.dirty = true; schedulePush(); } return; }
    const remote = clone(m.data()), mine = state.sync.remoteRev || 0;
    if (remote.rev === mine) { if (state.sync.dirty) schedulePush(); return; }
    if (remote.rev > mine) {
      if (state.sync.dirty) { syncConflict(remote); return; }
      const res = await pullAll(c);
      if (res) { applyRemote(res); render(); toast('Données mises à jour depuis ton compte'); }
    } else { state.sync.dirty = true; schedulePush(); }
  } catch (e) { syncErr = errText(e); }
  setSyncStatus();
}
async function syncStartup() {
  if (syncOn() && !state.tagSyncMig) { state.tagSyncMig = 1; state.sync.dirty = true; saveLocal(); }
  if (syncOn()) { const c = await getDB(); if (c) await checkRemote(c); return; }
  if (!storedFound && !state.classes.length && await dbGranted()) {
    const c = await getDB();
    if (!c) return;
    const m = await c.col.doc('meta').get();
    if (!m.exists) return;
    const meta = clone(m.data());
    const ok = await confirmDialog('Retrouver tes données ?', `Tes données ont été retrouvées dans ton compte (${meta.classes.length} classe${pl(meta.classes.length, '', 's')}, ${meta.ns} élève${pl(meta.ns, '', 's')}, modifiés le ${fmt(meta.updatedAt)}). Les restaurer et réactiver la synchronisation ?`, 'Restaurer');
    if (!ok) return;
    const res = await pullAll(c);
    if (res) { applyRemote(res); render(); toast('Données restaurées depuis ton compte'); }
  }
}

  if ($('layer').innerHTML) openSettingsPage('theme');
}
try {
  if (window.matchMedia) window.matchMedia('(min-width:1000px)').addEventListener('change', () => { if ($('layer') && $('layer').querySelector('.colchoice')) openSettingsPage('theme'); });
} catch (e) {}
function setTheme(id) {
  theme = id;
  lsSet('jokers_xp_theme', id); mode = modeOf(id);
  applyTheme(); render();
  if ($('layer').innerHTML) openSettingsPage('theme');
}
/* ============ Démarrage ============ */
saveLocal();
applyTheme();
render();
(async () => {
  try { await syncStartup(); } catch (e) {}
  try {
    const l = await snapList();
    if (!l.length) return;
    lastSnapJson = l[0].json;
    if (!storedFound && !state.classes.length) {
      const ok = await confirmDialog('Restaurer tes données ?', `Tes données semblent avoir disparu. Une sauvegarde automatique du ${fmt(l[0].t)} existe (${l[0].nc} classe${pl(l[0].nc, '', 's')}, ${l[0].ns} élève${pl(l[0].ns, '', 's')}).`, 'Restaurer');
      if (ok) applySnap(l[0]);
    }
  } catch (e) {}
})();
</script>
