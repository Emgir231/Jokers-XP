  if (!cur) { const first = T[0]; return first ? 'Retrait à partir de ' + fmtDurS(first.s) : 'Aucun retrait'; }
  const i = T.indexOf(cur), next = T[i + 1];
  const plage = next ? `de ${fmtDurS(cur.s)} à ${fmtDurS(next.s)}` : `à partir de ${fmtDurS(cur.s)}`;
  return `${plage} : -${cur.a} XP`;
}
function chronoSoundId() { return lsGet('jokers_xp_chrono_sound') || 'bip'; }
function chronoSoundLabel() { return (TIMER_SOUNDS.find(x => x[0] === chronoSoundId()) || TIMER_SOUNDS[0])[1]; }
/* Retrait automatique à chaque palier franchi (absents exclus), historique « Dissipation générale » */
function chronoApply(cid, amount) {
  const c = getClass(cid); if (!c) return;
  c.students.forEach(st => {
    if (isAbsent(st)) return;
    const real = Math.min(amount, st.xp);
    st.xp -= real; st.total = Math.max(0, st.total - amount);
    logH(st, 'Dissipation générale', -real, 'loss');
  });
}
/* Fin de séance : temps restant jusqu'à la fin du créneau en cours, ou prochain cours */
function seanceInfo(now) {
  const sl = currentSlot(now);
  if (sl) { const en = new Date(now); const [h, m] = sl.end.split(':').map(Number); en.setHours(h, m, 0, 0); return {slot: sl, sec: Math.max(0, Math.floor((en - now) / 1000)), end: sl.end}; }
  return null;
}
/* Chrono de dissipation : décompte manuel, pause et reprise ; les paliers de retrait sont franchis depuis son lancement */
function dissGet() { try { return JSON.parse(lsGet('jokers_xp_diss') || 'null'); } catch (e) { return null; } }
function dissSet(o) { lsSet('jokers_xp_diss', o ? JSON.stringify(o) : null); }
function dissMs(d) { return d ? d.acc + (d.run ? Date.now() - d.run : 0) : 0; }
function dissStart() { if (!pressCid) { toast('Ouvre une classe en présentation'); return; } dissSet({cid: pressCid, acc: 0, run: Date.now(), done: 0}); if (pressCid) renderPress(); }
function dissToggle() { const d = dissGet(); if (!d) return; const now = Date.now(); if (d.run) dissSet({cid: d.cid, acc: d.acc + now - d.run, run: null, done: d.done}); else dissSet({cid: d.cid, acc: d.acc, run: now, done: d.done}); if (pressCid) renderPress(); }
/* Réinitialisation : repart de zéro, sans rejouer les paliers, en gardant l'état (en cours ou en pause) */
function dissReset() { const d = dissGet(); if (!d) { dissStart(); return; } dissSet({cid: d.cid, acc: 0, run: d.run ? Date.now() : null, done: 0}); if (pressCid) renderPress(); }
function dissStop() { dissSet(null); if (pressCid) renderPress(); }
function dissTick() {
  const d = dissGet(), sec = dissMs(d) / 1000;
  const wd = $('diss-disp'), wm = $('diss-msg');
  if (!d) { if (wd) wd.textContent = '00:00'; if (wm) wm.textContent = 'Non lancé'; return; }
  if (wd) wd.textContent = fmtClock(sec * 1000);
  if (wm) wm.textContent = chronoLabel(sec);
  const T = chronoTiers().slice().sort((x, y) => x.s - y.s), crossed = T.filter(t => sec >= t.s).length;
  if (crossed > d.done) {
    T.slice(d.done, crossed).forEach(t => chronoApply(d.cid, t.a));
    dissSet({cid: d.cid, acc: d.acc, run: d.run, done: crossed}); save();
    playTimerSound(chronoSoundId());
    if (pressCid) renderPress();
  }
}
function seanceTick() {
  const wd = $('seance-disp'), wm = $('seance-msg'), i = seanceInfo(new Date());
  if (!i) { if (wd) wd.textContent = '--:--'; if (wm) wm.textContent = 'Pas de cours en ce moment'; return; }
  if (wd) wd.textContent = fmtClock(i.sec * 1000);
  if (wm) wm.textContent = 'Fin de ' + i.slot.id + ' à ' + i.end.replace(':', ' h ');
}
setInterval(() => { seanceTick(); dissTick(); }, 1000);

/* ===================== NIVEAU SONORE ===================== */
let micCtx = null, micAn = null, micData = null, micOn = false, micLevel = 0, micLastAlert = 0;
let micSim = false, simLevel = 40;
async function micStart() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { micSim = true; micOn = true; toast('Micro indisponible ici : simulation'); micLoop(); if (pressCid) renderPress(); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({audio: true});
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(st); micAn = micCtx.createAnalyser(); micAn.fftSize = 1024;
    src.connect(micAn); micData = new Float32Array(micAn.fftSize); micOn = true;
    micLoop();
  } catch (e) { micSim = true; micOn = true; toast('Micro non autorisé : simulation'); micLoop(); }
  if (pressCid) renderPress();
}
function micLoop() {
  if (!micOn) return;
  if (micSim) { simLevel = Math.max(0, Math.min(100, simLevel + (Math.random() - 0.5) * 18)); micLevel = Math.round(simLevel); }
  else { micAn.getFloatTimeDomainData(micData); let sum = 0; for (let i = 0; i < micData.length; i++) sum += micData[i] * micData[i]; const rms = Math.sqrt(sum / micData.length), db = 20 * Math.log10(rms + 1e-6); micLevel = Math.max(0, Math.min(100, Math.round((db + 90) / 90 * 100))); }
  const g = $('son-val'); if (g) g.textContent = micLevel;
  const arc = $('son-arc'); if (arc) arc.setAttribute('stroke-dashoffset', String(100 - micLevel));
  const max = state.sonoreMax == null ? 60 : state.sonoreMax;
  if (state.sonoreBell && micLevel > max && Date.now() - micLastAlert > 8000) {
    micLastAlert = Date.now(); state.sonoreCount = (state.sonoreCount || 0) + 1; playTimerSound(state.sonoreSound || 'bip');
    const c = $('son-count'); if (c) c.textContent = state.sonoreCount;
  }
  requestAnimationFrame(micLoop);
}
function sonoreSetMax(v) { state.sonoreMax = parseInt(v, 10); save(); const o = $('son-max'); if (o) o.textContent = state.sonoreMax; }
function micStop() {
  micOn = false; micSim = false;
  try { if (micCtx) micCtx.close(); } catch (e) {}
  micCtx = null; micAn = null; micLevel = 0;
  if (pressCid) renderPress();
}
function sonoreToggleBell() { state.sonoreBell = !state.sonoreBell; save(); if (pressCid) renderPress(); }
function sonoreBody() {
  const max = state.sonoreMax == null ? 60 : state.sonoreMax, bell = !!state.sonoreBell;
  const ticks = [0, 25, 50, 75, 100].map(t => `<span class="snt" style="left:${t}%"></span>`).join('');
  return `<svg class="sgauge" viewBox="0 0 200 110" aria-hidden="true"><path d="M10 100 A90 90 0 0 1 190 100" class="sg-bg" pathLength="100"/><path id="son-arc" d="M10 100 A90 90 0 0 1 190 100" class="sg-fg" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - micLevel}"/></svg>
    <div class="son-val"><b id="son-val">${micLevel}</b><small>/100</small></div>
    <div class="sslider"><div class="strack">${ticks}</div><input type="range" min="0" max="100" step="1" value="${max}" aria-label="Seuil maximum" onchange="sonoreSetMax(this.value)" oninput="sonoreSetMax(this.value)"></div>
    <div class="son-max-l">Seuil maximum : <b id="son-max">${max}</b></div>
    <div class="wbtns">
      <button class="chip ${bell ? 'on' : ''}" aria-pressed="${bell}" onclick="sonoreToggleBell()">Cloche ${bell ? 'activée' : 'coupée'}</button>
      <button class="chip ${micOn ? 'on' : ''}" aria-pressed="${micOn}" onclick="${micOn ? 'micStop()' : 'micStart()'}">${micOn ? (micSim ? 'Simulation : arrêter' : 'Micro actif : arrêter') : 'Activer le micro'}</button>
      <span class="son-cnt">Alertes : <b id="son-count">${state.sonoreCount || 0}</b></span>
      <button class="chip" onclick="sonoreReset()">Réinitialiser</button>
    </div>`;
}

async function exportData() {

  /* Page publiée : l'enregistrement d'un fichier passe par la capacité « downloads » */

  if (dl) {

    catch (e) { if (e && e.code === 'declined') return; toast("L'export n'est pas disponible ici"); return; }
    state.lastExport = Date.now(); save(); toast('Sauvegarde exportée'); openSettingsPage('backup');
    return;
  }
  const file = new File([json], name, {type:'application/json'});

    else downloadFile(file);
  } catch (e) {
    if (e && e.name === 'AbortError') return;

  }
  state.lastExport = Date.now(); save(); toast('Sauvegarde exportée'); openSettingsPage('backup');

/* ============ Fusion de deux sauvegardes (sans rien perdre) ============ */
/* Principes : l'historique est une suite d'événements datés et identifiés : on garde l'union, sans doublon.
   Le solde (xp) est recalculé à partir de l'historique fusionné. Le total garde le plus grand des deux (cumul).

  tapTimes = tapTimes.filter(x => now - x < 2000);
  tapTimes.push(now);
  if (tapTimes.length < 5) return;
  tapTimes = [];
  if (theme !== 'ubuntu') {
    lsSet('jokers_xp_prev_theme', theme);
    setTheme('ubuntu');
    toast('Thème par défaut : Ubuntu');
  } else {
    const back = lsGet('jokers_xp_prev_theme');
    if (back && back !== 'ubuntu' && THEMES.some(x => x.id === back)) {
      lsSet('jokers_xp_prev_theme', null);
      setTheme(back);
      toast('Thème précédent rétabli');
    } else toast('Aucun thème précédent à rétablir');
  }
}
document.addEventListener('pointerup', emptyTapAt, {passive: true});
</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }</script>
